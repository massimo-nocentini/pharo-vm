# The security watch of the cairo stack (decision U9, docs/CairoStack.md,
# "Security bumps"), every Monday and on demand:
#
#   - scripts/cairo-stack/check-latest.sh compares each pin of
#     cmake/cairo-stack/pins.txt with its upstream's latest release (the
#     GitHub and GitLab APIs, the cairographics.org, savannah and SourceForge
#     listings) and the msys2 section with MSYS2's repositories, and fails
#     (a red run) when one is behind, gone or unknown; the job summary lists
#     them.  A release that fixes a CVE reachable from the images is bumped
#     within 14 days (docs/CairoStack.md);
#   - scripts/cairo-stack/check-pins.sh fails when a pinned file no longer
#     downloads (MSYS2 removes superseded packages after a while: mirror
#     them, docs/CairoStack.md), when a native-ahead exception expired, or
#     when the native and wasm pins drifted apart.
#
# GitHub runs a scheduled workflow from the default branch only, offers
# workflow_dispatch only once the file is there, and stops scheduling it
# after 60 days without activity in the repository.  A push that changes
# this file or the watch script also runs it, on any branch.

name: Cairo stack watch

on:
  schedule:
    - cron: '23 5 * * 1'
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/cairo-stack-watch.yml'
      - 'scripts/cairo-stack/check-latest.sh'

permissions:
  contents: read

jobs:
  watch:
    name: Pins against upstream
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      # (zstd and tar read MSYS2's repository databases; GITHUB_TOKEN lifts
      # the rate limit of the GitHub API)
      - name: Compare the pins with the latest releases
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          command -v zstd > /dev/null || { sudo apt-get update && sudo apt-get install -y --no-install-recommends zstd; }
          status=0
          sh scripts/cairo-stack/check-latest.sh > "$RUNNER_TEMP/latest.txt" 2>&1 || status=$?
          cat "$RUNNER_TEMP/latest.txt"
          {
            echo '### The pins of cmake/cairo-stack/pins.txt against upstream'
            echo
            echo '```'
            cat "$RUNNER_TEMP/latest.txt"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          exit "$status"

      - name: Check that every pinned file still downloads
        if: ${{ !cancelled() }}
        run: sh scripts/cairo-stack/check-pins.sh
