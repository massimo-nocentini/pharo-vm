# Build the Pharo VM (CoInterpreter, sources generated by VMMaker on each
# runner but Windows arm64, which builds those of the generate job) and
# upload the CPack bin zip of each platform as an artifact:
#
#   PharoVM-<version>-Linux-x86_64-bin.zip     ubuntu-24.04
#   PharoVM-<version>-Linux-aarch64-bin.zip    ubuntu-24.04-arm
#   PharoVM-<version>-Darwin-x86_64-bin.zip    macos-15-intel
#   PharoVM-<version>-Darwin-arm64-bin.zip     macos-15
#   PharoVM-<version>-Windows-x86_64-bin.zip   windows-2025, MSYS2 UCRT64
#   PharoVM-<version>-Windows-arm64-bin.zip    windows-11-arm, MSYS2 CLANGARM64
#   PharoVM-<version>-WebAssembly-bin.zip      ubuntu-24.04, Emscripten
#
# where <version> is the version of the VM without the count of commits
# since its tag (v12.0.5-beta-4266c4ec4 for v12.0.5-beta+28.4266c4ec4).
# On a push to pharo-12, when the seven jobs and the cairo-stack job
# succeed, the zips are also published as the GitHub release
# PharoVM-<version>, tagged at the commit built, with cairo-stack-sources.tar
# (the sources of the cairo stack, below); other branches keep them as
# artifacts of their run.
#
# The WebAssembly zip is what `make wasm` stages (docs/WebAssembly.md): the
# site web/ and the node VM node/, built with libgit2 and the images of the
# site, Pharo 15 (the default), 14 and 13.1, each prepared for the world,
# and the .sources of the Pharo 15 build that the site had before (for the
# images saved in a browser from it), with serve.mjs and
# packaging/emscripten/dist (README.md, which names the commit, and
# node-try.sh).  On a push to pharo-12, its web/ is also deployed to
# GitHub Pages once every file of its manifest is checked.
#
# Every job compiles C with clang and C++ with clang++: CC and CXX on Linux
# and macOS (AppleClang there), -DCMAKE_C_COMPILER and -DCMAKE_CXX_COMPILER
# in MSYS2, and in the WebAssembly job emcc and em++ (clang) for the VMs and
# clang for the native tree that generates their sources.  After configuring,
# scripts/check-clang.sh fails the job if CMake found another compiler.
#
# Linux and macOS bundle the prebuilt libraries of files.pharo.org
# (PHARO_DEPENDENCIES_PREFER_DOWNLOAD_BINARIES), Windows the DLLs of the
# MSYS2 packages (cmake/importMinGWDependencies.cmake), except cairo and
# FreeType and the libraries they need, the cairo stack (docs/CairoStack.md,
# cmake/cairo-stack/pins.txt):
#
#   - Linux and macOS build it on the runner from the pinned archives
#     (scripts/cairo-stack/build.sh: meson, ninja and pkgconf from PyPI by
#     hash, gperf from apt on Linux), cached by the pins, the scripts and the
#     toolchain, but not on the runs that publish a release.  Built on
#     Ubuntu 24.04, the Linux stack needs glibc 2.38 (the VM itself 2.34);
#   - Windows bundles MSYS2's packages of cairo, FreeType and their DLL
#     closure, pinned there by URL and SHA256 (fetch-msys2.sh), not the
#     runner's: x86_64 through the ExternalProject of cmake/cairoStack.cmake,
#     as a developer's build does, arm64 through PHARO_CAIRO_STACK_DIR.
#
# scripts/cairo-stack/check.sh then checks the stack of each native zip, and
# the step of the CairoPlugin draws toy text through it.  The cairo-stack job
# checks the pins (scripts/cairo-stack/check-pins.sh) and gathers the sources
# of the stack; .github/workflows/cairo-stack-watch.yml compares the pins
# with the latest upstream releases every week.
#
# <version> comes from `git describe` (cmake/versionExtraction.cmake), so
# every job checks out the whole history and fetches the release tags of
# pharo-project/pharo-vm, which a fork may not have.

name: Build

on:
  push:
    paths-ignore: ['docs/**', '**/*.md']
  pull_request:
    paths-ignore: ['docs/**', '**/*.md']

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linux:
    name: Linux ${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        include:
          - { arch: x86_64,  runner: ubuntu-24.04 }
          - { arch: aarch64, runner: ubuntu-24.04-arm }
    env:
      CC: clang
      CXX: clang++
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Fetch the release tags
        run: |
          git fetch --no-tags --force https://github.com/pharo-project/pharo-vm.git '+refs/tags/v*:refs/tags/v*'
          git describe --tags --match 'v[0-9]*'

      # gperf (fontconfig) and python3-venv (meson, ninja and pkgconf) build
      # the cairo stack.  The cairo of the zip has no X11: no libx11-6 or
      # libxext6
      - name: Install the dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends clang cmake make unzip uuid-dev libssl-dev gperf python3-venv

      # The cache key of the cairo stack holds the toolchain that builds it:
      # the compilers, glibc, cmake, gperf and python (meson, ninja and
      # pkgconf are pinned by scripts/cairo-stack/requirements.txt, so in the
      # hash of the files)
      - name: Fingerprint the toolchain of the cairo stack
        id: toolchain
        shell: bash
        run: |
          {
            uname -m
            "$CC" --version | sed -n 1p
            "$CXX" --version | sed -n 1p
            ldd --version | sed -n 1p
            cmake --version | sed -n 1p
            gperf --version | sed -n 1p
            python3 --version
          } | tee "$RUNNER_TEMP/toolchain.txt"
          echo "fp=$(sha256sum "$RUNNER_TEMP/toolchain.txt" | cut -c1-16)" >> "$GITHUB_OUTPUT"

      # Not on the runs that publish a release, whose stack is built from the
      # pinned archives by the current toolchain.  The configure checks the
      # manifest of a restored stack against pins.txt anyway
      - name: Restore the cairo stack
        id: cache
        if: ${{ !(github.event_name == 'push' && github.ref == 'refs/heads/pharo-12') }}
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/cairo-stack
          key: cairo-stack-${{ runner.os }}-${{ matrix.arch }}-${{ hashFiles('cmake/cairo-stack/**', 'scripts/cairo-stack/**') }}-${{ steps.toolchain.outputs.fp }}

      # meson, ninja and pkgconf from PyPI, each file by its hash (the meson
      # of Ubuntu 24.04 is too old for fontconfig); build.sh checks the
      # SHA256 of every archive before it extracts it, and ends with check.sh
      # on the prefix: no GLIBC_ symbol newer than the runner's 2.39
      - name: Build the cairo stack
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          python3 -m venv "$RUNNER_TEMP/mesonenv"
          "$RUNNER_TEMP/mesonenv/bin/pip" install --quiet --require-hashes --only-binary :all: -r scripts/cairo-stack/requirements.txt
          PATH="$RUNNER_TEMP/mesonenv/bin:$PATH" sh scripts/cairo-stack/build.sh --platform linux \
            --prefix "$RUNNER_TEMP/cairo-stack" --work "$RUNNER_TEMP/cairo-stack-work" \
            --downloads "$RUNNER_TEMP/cairo-stack-dl" --glibc-max 2.39

      # With the cairo stack of the steps above, whose manifest CMake checks
      # (pins, platform, architecture)
      - name: Configure
        shell: bash
        run: |
          cmake -S . -B build \
            -DFLAVOUR=CoInterpreter \
            -DPHARO_DEPENDENCIES_PREFER_DOWNLOAD_BINARIES=TRUE \
            -DICEBERG_DEFAULT_REMOTE=httpsUrl \
            -DBUILD_WITH_GRAPHVIZ=OFF \
            -DPHARO_CAIRO_STACK_DIR="$RUNNER_TEMP/cairo-stack" | tee "$RUNNER_TEMP/configure.txt"
          grep -q 'PHARO_CAIRO_STACK_DIR, manifest checked' "$RUNNER_TEMP/configure.txt"

      - name: Check that CMake uses clang and clang++
        run: sh scripts/check-clang.sh build

      - name: Build
        run: cmake --build build --parallel "$(nproc)"

      - name: Package
        run: cmake --build build --target package

      - name: Drop the commit count from the name of the zip
        run: |
          cd build/build/packages
          for zip in PharoVM-*-bin.zip; do mv "$zip" "$(echo "$zip" | sed -E 's/\+[0-9]+\./-/')"; done
          ls PharoVM-*-bin.zip

      # --version stops before loading an image: also run the VMMaker image
      - name: Run the VM of the zip
        run: |
          unzip -q build/build/packages/PharoVM-*-Linux-${{ matrix.arch }}-bin.zip -d "$RUNNER_TEMP/vm"
          "$RUNNER_TEMP/vm/pharo" --version
          "$RUNNER_TEMP/vm/pharo" --headless build/build/vmmaker/image/VMMaker.image --no-default-preferences eval '3 + 4' | tee "$RUNNER_TEMP/eval.txt"
          grep -qx 7 "$RUNNER_TEMP/eval.txt"

      # scripts/cairo-stack/check.sh (docs/CairoStack.md): the libraries, the
      # symlinks and the notices of the stack in the zip; their NEEDED, by an
      # allow-list (the stack and glibc: no X11, libz.so.1 or libexpat.so.1);
      # DT_RPATH $ORIGIN; the exports the images bind; the version of the
      # pin; toy text with ink (probe.c, fontconfig on the runner's
      # /etc/fonts); and the newest GLIBC_ version the stack needs, at most
      # the runner's 2.39 (decision U1: 2.38 today).  The job summary has it
      # next to the VM's own
      - name: Check the cairo stack of the zip
        shell: bash
        run: |
          sh scripts/cairo-stack/check.sh --bundle "$RUNNER_TEMP/vm" --platform linux --glibc-max 2.39 | tee "$RUNNER_TEMP/cairo-stack-check.txt"
          stack=$(sed -n 's/^glibc-max //p' "$RUNNER_TEMP/cairo-stack-check.txt")
          vm=$(objdump -T "$RUNNER_TEMP/vm/lib/pharo" "$RUNNER_TEMP/vm/lib/libPharoVMCore.so" | { grep -o 'GLIBC_[0-9.]*' || true; } | sed 's/^GLIBC_//' | sort -uV | tail -n 1)
          test -n "$stack" && test -n "$vm"
          echo "glibc: the VM needs $vm, the cairo stack $stack"
          echo "Linux ${{ matrix.arch }}: the VM needs glibc $vm, the cairo stack (cairo, FreeType, fontconfig...) glibc $stack" >> "$GITHUB_STEP_SUMMARY"

      # The plugin and libSimdJSONFFI are C++: they must load (the library
      # through the FFI), and need no libstdc++ newer than the GLIBCXX_3.4.21
      # of GCC 5 (cmake/simdjson.cmake)
      - name: Load the SimdJSONPlugin and libSimdJSONFFI of the zip
        run: |
          "$RUNNER_TEMP/vm/pharo" --headless build/build/vmmaker/image/VMMaker.image --no-default-preferences st plugins/SimdJSONPlugin/tests/ci-load.st | tee "$RUNNER_TEMP/simdjson.txt"
          grep -q '^SimdJSONPlugin native ' "$RUNNER_TEMP/simdjson.txt"
          grep -q '^SimdJSONFFI 1 ' "$RUNNER_TEMP/simdjson.txt"
          for lib in libSimdJSONPlugin.so libSimdJSONFFI.so; do
            glibcxx=$(objdump -T "$RUNNER_TEMP/vm/lib/$lib" | grep -o 'GLIBCXX_[0-9.]*' | sort -uV | tail -n 1)
            echo "$lib: $glibcxx"
            test "$(printf '%s\n' "$glibcxx" GLIBCXX_3.4.21 | sort -V | tail -n 1)" = GLIBCXX_3.4.21
          done

      # The SimdUTFPlugin and libSimdUTFFFI are C++ (cmake/simdutf.cmake): they
      # must load (the library through the FFI), run a kernel of simdutf, refuse
      # a bogus SIMDUTF_FORCE_IMPLEMENTATION, honour fallback where the build has
      # more than one kernel (x86_64), and need no libstdc++ newer than
      # GLIBCXX_3.4.21 (simdutf needs none at all).  The licence files of
      # simdutf and the PyTorch notices of simdutf and simdjson must be in the
      # zip, next to the plugins.  shell: bash runs the step with pipefail, so
      # that a VM that dies after printing (in the callouts of libSimdUTFFFI)
      # fails the step, not only tee
      - name: Load the SimdUTFPlugin and libSimdUTFFFI of the zip
        shell: bash
        run: |
          probe() { "$RUNNER_TEMP/vm/pharo" --headless build/build/vmmaker/image/VMMaker.image --no-default-preferences st plugins/SimdUTFPlugin/tests/ci-load.st; }
          probe | tee "$RUNNER_TEMP/simdutf.txt"
          grep -q '^SimdUTFPlugin native ' "$RUNNER_TEMP/simdutf.txt"
          grep -q '^SimdUTFFFI 1 ' "$RUNNER_TEMP/simdutf.txt"
          SIMDUTF_FORCE_IMPLEMENTATION=bogus probe | tee "$RUNNER_TEMP/simdutf-bogus.txt"
          grep -q '^SimdUTFPlugin native .* forced refused bogus ok' "$RUNNER_TEMP/simdutf-bogus.txt"
          grep -q '^SimdUTFFFI 1 .* forced refused bogus$' "$RUNNER_TEMP/simdutf-bogus.txt"
          SIMDUTF_FORCE_IMPLEMENTATION=fallback probe | tee "$RUNNER_TEMP/simdutf-fallback.txt"
          if [ "$(uname -m)" = x86_64 ]; then
            grep -q '^SimdUTFPlugin native fallback .* forced fallback ok' "$RUNNER_TEMP/simdutf-fallback.txt"
            grep -q '^SimdUTFFFI 1 fallback forced fallback$' "$RUNNER_TEMP/simdutf-fallback.txt"
          else
            grep -q '^SimdUTFPlugin native arm64 .* forced refused fallback ok' "$RUNNER_TEMP/simdutf-fallback.txt"
            grep -q '^SimdUTFFFI 1 arm64 forced refused fallback$' "$RUNNER_TEMP/simdutf-fallback.txt"
          fi
          # (grep finds no GLIBCXX at all in them today, which must not fail
          # the step under pipefail)
          for lib in libSimdUTFPlugin.so libSimdUTFFFI.so; do
            test -f "$RUNNER_TEMP/vm/lib/$lib"
            glibcxx=$(objdump -T "$RUNNER_TEMP/vm/lib/$lib" | { grep -o 'GLIBCXX_[0-9.]*' || true; } | sort -uV | tail -n 1)
            echo "$lib: ${glibcxx:-no GLIBCXX}"
            test -z "$glibcxx" || test "$(printf '%s\n' "$glibcxx" GLIBCXX_3.4.21 | sort -V | tail -n 1)" = GLIBCXX_3.4.21
          done
          for f in LICENSE.simdutf LICENSE.simdutf-MIT LICENSE.simdutf-isadetection LICENSE.simdjson-isadetection; do
            test -f "$RUNNER_TEMP/vm/lib/$f" || { echo "missing $f"; exit 1; }
          done

      # The TimSortPlugin and libTimSortFFI are C (cmake/timsort.cmake): they
      # must load (the library through the FFI), sort numbers, strings, a
      # Float64Array and keys, and run a sort by a sortBlock on the stack of
      # the resumable sort (the hand-written switch of x86_64 or aarch64), each
      # comparison answered by the image, through the plugin and through the
      # library (tests/ci-load.st).  The PSF notice of timsort.c must be in the
      # zip, next to the plugins.  shell: bash runs the step with pipefail, so
      # that a VM that dies after printing fails the step, not only tee
      - name: Load the TimSortPlugin and libTimSortFFI of the zip
        shell: bash
        run: |
          "$RUNNER_TEMP/vm/pharo" --headless build/build/vmmaker/image/VMMaker.image --no-default-preferences st plugins/TimSortPlugin/tests/ci-load.st | tee "$RUNNER_TEMP/timsort.txt"
          grep -q '^TimSortPlugin native timsort\.c [0-9a-f]* coroutines yes [0-9]* ok' "$RUNNER_TEMP/timsort.txt"
          grep -q '^TimSortFFI 1 [0-9a-f]* asm-[a-z0-9_-]* coroutines yes [0-9]* ok' "$RUNNER_TEMP/timsort.txt"
          for f in libTimSortPlugin.so libTimSortFFI.so LICENSE.timsort; do
            test -f "$RUNNER_TEMP/vm/lib/$f" || { echo "missing $f"; exit 1; }
          done

      # The UtilsPlugin (C, cmake/plugins.cmake): fma, strtok_r, de Casteljau
      # and Knuth's generator must answer their known values, Knuth's own
      # check of his rng-double.c included (tests/ci-load.st)
      - name: Load the UtilsPlugin of the zip
        shell: bash
        run: |
          "$RUNNER_TEMP/vm/pharo" --headless build/build/vmmaker/image/VMMaker.image --no-default-preferences st plugins/UtilsPlugin/tests/ci-load.st | tee "$RUNNER_TEMP/utils.txt"
          grep -q '^UtilsPlugin native 1 ok' "$RUNNER_TEMP/utils.txt"
          test -f "$RUNNER_TEMP/vm/lib/libUtilsPlugin.so" || { echo "missing libUtilsPlugin.so"; exit 1; }

      # The CairoPlugin (C, and the C++ engine of the SimdUTFPlugin for its
      # text, cmake/plugins.cmake): bound to the libcairo of the zip that the
      # image's FFI loads (one library, the same instance), it must draw a
      # scene of rectangles, paths, a transform and text with the pixels of
      # the FFI, through its one-for-one primitives and through its shape and
      # text primitives (tests/ci-load.st, on the VMMaker image, whose
      # Athens-Cairo draws headless).  It prints 'CairoPlugin FAILED cairo not
      # loadable' when the libcairo of the zip does not load, and must report
      # exactly the cairo of cmake/cairo-stack/pins.txt.  Its CairoToy line is
      # toy text (cairo_select_font_face and cairo_show_text through the
      # image's FFI) with ink: fontconfig and the system's fonts here, Quartz
      # on macOS, DWrite on Windows.  Like the SimdUTFPlugin, it needs no
      # libstdc++ newer than GLIBCXX_3.4.21.  shell: bash runs the step with
      # pipefail, so that a VM that dies after printing fails the step
      - name: Load the CairoPlugin of the zip
        shell: bash
        run: |
          cairo=$(awk '$1 == "cairo" { print $2; exit }' cmake/cairo-stack/pins.txt | sed 's/\./\\./g')
          test -n "$cairo"
          "$RUNNER_TEMP/vm/pharo" --headless build/build/vmmaker/image/VMMaker.image --no-default-preferences st plugins/CairoPlugin/tests/ci-load.st | tee "$RUNNER_TEMP/cairo.txt"
          grep -q "^CairoPlugin native 1 cairo $cairo ok" "$RUNNER_TEMP/cairo.txt"
          grep -Eq '^CairoToy ok family .+ ink [1-9][0-9]*( |$)' "$RUNNER_TEMP/cairo.txt"
          lib="$RUNNER_TEMP/vm/lib/libCairoPlugin.so"
          test -f "$lib" || { echo "missing libCairoPlugin.so"; exit 1; }
          glibcxx=$(objdump -T "$lib" | { grep -o 'GLIBCXX_[0-9.]*' || true; } | sort -uV | tail -n 1)
          echo "libCairoPlugin.so: ${glibcxx:-no GLIBCXX}"
          test -z "$glibcxx" || test "$(printf '%s\n' "$glibcxx" GLIBCXX_3.4.21 | sort -V | tail -n 1)" = GLIBCXX_3.4.21

      - uses: actions/upload-artifact@v7
        with:
          path: build/build/packages/PharoVM-*-Linux-${{ matrix.arch }}-bin.zip
          archive: false
          if-no-files-found: error

  macos:
    name: macOS ${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        include:
          - { arch: x86_64, runner: macos-15-intel }
          - { arch: arm64,  runner: macos-15 }
    env:
      CC: clang
      CXX: clang++
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Fetch the release tags
        run: |
          git fetch --no-tags --force https://github.com/pharo-project/pharo-vm.git '+refs/tags/v*:refs/tags/v*'
          git describe --tags --match 'v[0-9]*'

      # The platform name of the zip and the prebuilt libraries follow the
      # host, not CMAKE_OSX_ARCHITECTURES
      - name: Check the architecture of the runner
        run: test "$(uname -m)" = "${{ matrix.arch }}"

      # As on Linux: the cache key of the cairo stack holds Xcode, its SDK,
      # the compiler, cmake and python
      - name: Fingerprint the toolchain of the cairo stack
        id: toolchain
        shell: bash
        run: |
          {
            uname -m
            xcodebuild -version | tr '\n' ' '; echo
            xcrun --show-sdk-version
            clang --version | sed -n 1p
            cmake --version | sed -n 1p
            python3 --version
          } | tee "$RUNNER_TEMP/toolchain.txt"
          echo "fp=$(shasum -a 256 "$RUNNER_TEMP/toolchain.txt" | cut -c1-16)" >> "$GITHUB_OUTPUT"

      - name: Restore the cairo stack
        id: cache
        if: ${{ !(github.event_name == 'push' && github.ref == 'refs/heads/pharo-12') }}
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/cairo-stack
          key: cairo-stack-${{ runner.os }}-${{ matrix.arch }}-${{ hashFiles('cmake/cairo-stack/**', 'scripts/cairo-stack/**') }}-${{ steps.toolchain.outputs.fp }}

      # As on Linux, with pkgconf from PyPI too (no Homebrew: build.sh also
      # keeps /opt/homebrew and /usr/local out of the CMake searches), for
      # the one architecture of the runner, from macOS 11.0 on (the VM's
      # CMAKE_OSX_DEPLOYMENT_TARGET), with Quartz and without fontconfig
      - name: Build the cairo stack
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          python3 -m venv "$RUNNER_TEMP/mesonenv"
          "$RUNNER_TEMP/mesonenv/bin/pip" install --quiet --require-hashes --only-binary :all: -r scripts/cairo-stack/requirements.txt
          PATH="$RUNNER_TEMP/mesonenv/bin:$PATH" MACOSX_DEPLOYMENT_TARGET=11.0 sh scripts/cairo-stack/build.sh --platform darwin \
            --arch ${{ matrix.arch }} --prefix "$RUNNER_TEMP/cairo-stack" --work "$RUNNER_TEMP/cairo-stack-work" \
            --downloads "$RUNNER_TEMP/cairo-stack-dl"

      # On arm64 the VM uses the libffi of the system, as upstream does
      # (FindFFI does not look into the SDK by itself).  The cairo stack is
      # the one of the steps above, whose manifest CMake checks (pins,
      # platform, architecture, deployment target)
      - name: Configure
        shell: bash
        run: |
          extra=()
          if [ "${{ matrix.arch }}" = arm64 ]; then
            sdk="$(xcrun --show-sdk-path)"
            extra=(-DFFI_LIBRARY="$sdk/usr/lib/libffi.tbd" -DFFI_INCLUDE_DIR="$sdk/usr/include/ffi")
          fi
          cmake -S . -B build \
            -DFLAVOUR=CoInterpreter \
            -DPHARO_DEPENDENCIES_PREFER_DOWNLOAD_BINARIES=TRUE \
            -DICEBERG_DEFAULT_REMOTE=httpsUrl \
            -DBUILD_WITH_GRAPHVIZ=OFF \
            -DCMAKE_OSX_ARCHITECTURES=${{ matrix.arch }} \
            -DCMAKE_OSX_SYSROOT=macosx \
            -DPHARO_CAIRO_STACK_DIR="$RUNNER_TEMP/cairo-stack" \
            "${extra[@]}" | tee "$RUNNER_TEMP/configure.txt"
          grep -q 'PHARO_CAIRO_STACK_DIR, manifest checked' "$RUNNER_TEMP/configure.txt"

      - name: Check that CMake uses clang and clang++
        run: sh scripts/check-clang.sh build

      - name: Build
        run: cmake --build build --parallel "$(sysctl -n hw.ncpu)"

      - name: Package
        run: cmake --build build --target package

      - name: Drop the commit count from the name of the zip
        run: |
          cd build/build/packages
          for zip in PharoVM-*-bin.zip; do mv "$zip" "$(echo "$zip" | sed -E 's/\+[0-9]+\./-/')"; done
          ls PharoVM-*-bin.zip

      # --version stops before loading an image: also run the VMMaker image
      - name: Run the VM of the zip
        run: |
          unzip -q build/build/packages/PharoVM-*-Darwin-${{ matrix.arch }}-bin.zip -d "$RUNNER_TEMP/vm"
          "$RUNNER_TEMP/vm/Pharo.app/Contents/MacOS/Pharo" --headless --version
          "$RUNNER_TEMP/vm/Pharo.app/Contents/MacOS/Pharo" --headless build/build/vmmaker/image/VMMaker.image --no-default-preferences eval '3 + 4' | tee "$RUNNER_TEMP/eval.txt"
          grep -qx 7 "$RUNNER_TEMP/eval.txt"

      # As on Linux, for Contents/MacOS/Plugins (the notices in
      # Contents/Resources): install names @rpath/, LC_RPATH @loader_path,
      # the dependencies by an allow-list (the stack, /usr/lib and /System:
      # nothing of Homebrew, no libz of the system), minos at most 11.0, one
      # architecture, the signatures, libfreetype.dylib and libcairo.dylib
      # symlinks, cairo_quartz_surface_create, toy text through Quartz
      - name: Check the cairo stack of the zip
        shell: bash
        run: |
          sh scripts/cairo-stack/check.sh --bundle "$RUNNER_TEMP/vm/Pharo.app" --platform darwin --arch ${{ matrix.arch }} --minos 11.0 | tee "$RUNNER_TEMP/cairo-stack-check.txt"

      - name: Load the SimdJSONPlugin of the zip
        run: |
          "$RUNNER_TEMP/vm/Pharo.app/Contents/MacOS/Pharo" --headless build/build/vmmaker/image/VMMaker.image --no-default-preferences st plugins/SimdJSONPlugin/tests/ci-load.st | tee "$RUNNER_TEMP/simdjson.txt"
          grep -q '^SimdJSONPlugin native ' "$RUNNER_TEMP/simdjson.txt"

      # As on Linux, without the checks of libSimdUTFFFI and of libstdc++
      # (as the SimdJSON step above): simdutf has never run on
      # macOS x86_64 upstream, and its guard of SIMDUTF_FORCE_IMPLEMENTATION
      # matters on every build with more than one kernel.  The licence files
      # go to Contents/Resources (cmake/simdutf.cmake).  shell: bash: with
      # pipefail, a VM that dies after printing fails the step
      - name: Load the SimdUTFPlugin of the zip
        shell: bash
        run: |
          probe() { "$RUNNER_TEMP/vm/Pharo.app/Contents/MacOS/Pharo" --headless build/build/vmmaker/image/VMMaker.image --no-default-preferences st plugins/SimdUTFPlugin/tests/ci-load.st; }
          probe | tee "$RUNNER_TEMP/simdutf.txt"
          grep -q '^SimdUTFPlugin native ' "$RUNNER_TEMP/simdutf.txt"
          SIMDUTF_FORCE_IMPLEMENTATION=bogus probe | tee "$RUNNER_TEMP/simdutf-bogus.txt"
          grep -q '^SimdUTFPlugin native .* forced refused bogus ok' "$RUNNER_TEMP/simdutf-bogus.txt"
          SIMDUTF_FORCE_IMPLEMENTATION=fallback probe | tee "$RUNNER_TEMP/simdutf-fallback.txt"
          if [ "$(uname -m)" = x86_64 ]; then
            grep -q '^SimdUTFPlugin native fallback .* forced fallback ok' "$RUNNER_TEMP/simdutf-fallback.txt"
          else
            grep -q '^SimdUTFPlugin native arm64 .* forced refused fallback ok' "$RUNNER_TEMP/simdutf-fallback.txt"
          fi
          for f in LICENSE.simdutf LICENSE.simdutf-MIT LICENSE.simdutf-isadetection LICENSE.simdjson-isadetection; do
            test -f "$RUNNER_TEMP/vm/Pharo.app/Contents/Resources/$f" || { echo "missing $f"; exit 1; }
          done

      # As on Linux, the library included (FFIMacLibraryFinder finds it in
      # Contents/MacOS/Plugins): the resumable sort's switch for Mach-O
      # (x86_64 and arm64) has never run before this step.  The notice goes to
      # Contents/Resources (cmake/timsort.cmake)
      - name: Load the TimSortPlugin and libTimSortFFI of the zip
        shell: bash
        run: |
          "$RUNNER_TEMP/vm/Pharo.app/Contents/MacOS/Pharo" --headless build/build/vmmaker/image/VMMaker.image --no-default-preferences st plugins/TimSortPlugin/tests/ci-load.st | tee "$RUNNER_TEMP/timsort.txt"
          grep -q '^TimSortPlugin native timsort\.c [0-9a-f]* coroutines yes [0-9]* ok' "$RUNNER_TEMP/timsort.txt"
          grep -q '^TimSortFFI 1 [0-9a-f]* asm-[a-z0-9_-]* coroutines yes [0-9]* ok' "$RUNNER_TEMP/timsort.txt"
          test -f "$RUNNER_TEMP/vm/Pharo.app/Contents/Resources/LICENSE.timsort" || { echo "missing LICENSE.timsort"; exit 1; }

      - name: Load the UtilsPlugin of the zip
        shell: bash
        run: |
          "$RUNNER_TEMP/vm/Pharo.app/Contents/MacOS/Pharo" --headless build/build/vmmaker/image/VMMaker.image --no-default-preferences st plugins/UtilsPlugin/tests/ci-load.st | tee "$RUNNER_TEMP/utils.txt"
          grep -q '^UtilsPlugin native 1 ok' "$RUNNER_TEMP/utils.txt"

      # As on Linux: the CairoPlugin bound to the libcairo of the zip (the
      # pinned cairo), in Contents/MacOS/Plugins with the other plugins, and
      # toy text (Quartz).  Then once more with DYLD_PRINT_LIBRARIES (on
      # stderr): the image loads libfreetype.dylib and libcairo.dylib, cairo
      # @rpath/libfreetype.6.dylib, and dyld must map one FreeType and one
      # cairo (the symlinks of the zip), so that cairo and the image share
      # FreeType
      - name: Load the CairoPlugin of the zip
        shell: bash
        run: |
          cairo=$(awk '$1 == "cairo" { print $2; exit }' cmake/cairo-stack/pins.txt | sed 's/\./\\./g')
          test -n "$cairo"
          "$RUNNER_TEMP/vm/Pharo.app/Contents/MacOS/Pharo" --headless build/build/vmmaker/image/VMMaker.image --no-default-preferences st plugins/CairoPlugin/tests/ci-load.st | tee "$RUNNER_TEMP/cairo.txt"
          grep -q "^CairoPlugin native 1 cairo $cairo ok" "$RUNNER_TEMP/cairo.txt"
          grep -Eq '^CairoToy ok family .+ ink [1-9][0-9]*( |$)' "$RUNNER_TEMP/cairo.txt"
          test -f "$RUNNER_TEMP/vm/Pharo.app/Contents/MacOS/Plugins/libCairoPlugin.dylib" || { echo "missing libCairoPlugin.dylib"; exit 1; }
          DYLD_PRINT_LIBRARIES=1 "$RUNNER_TEMP/vm/Pharo.app/Contents/MacOS/Pharo" --headless build/build/vmmaker/image/VMMaker.image --no-default-preferences st plugins/CairoPlugin/tests/ci-load.st > "$RUNNER_TEMP/cairo-dyld.txt" 2> "$RUNNER_TEMP/dyld.txt"
          grep -q "^CairoPlugin native 1 cairo $cairo ok" "$RUNNER_TEMP/cairo-dyld.txt"
          grep -e '/libfreetype' -e '/libcairo' "$RUNNER_TEMP/dyld.txt" || true
          test "$(grep -c '/libfreetype' "$RUNNER_TEMP/dyld.txt")" -eq 1
          test "$(grep -c '/libcairo' "$RUNNER_TEMP/dyld.txt")" -eq 1

      - uses: actions/upload-artifact@v7
        with:
          path: build/build/packages/PharoVM-*-Darwin-${{ matrix.arch }}-bin.zip
          archive: false
          if-no-files-found: error

  # The C sources of VMMaker and the VMMaker image, for Windows arm64: there
  # the x86_64 VM that cmake/vmmaker.cmake downloads to run VMMaker dies
  # under the x64 emulation of Windows 11 (VirtualProtect fails, then exit
  # code 0xC00000FF), and files.pharo.org has no Windows arm64 VM.  The
  # sources do not depend on the platform: cogit.c includes every JIT
  # backend and picks one with #if
  generate:
    name: Generate the C sources
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      CC: clang
      CXX: clang++
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Fetch the release tags
        run: |
          git fetch --no-tags --force https://github.com/pharo-project/pharo-vm.git '+refs/tags/v*:refs/tags/v*'
          git describe --tags --match 'v[0-9]*'

      - name: Install the dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends clang cmake make unzip uuid-dev libssl-dev

      # Without cairo and FreeType, which this job does not bundle, as the
      # host tree of make wasm: their cairo stack would need its tools
      # (meson, ninja, pkgconf, gperf) to configure, and the sources do not
      # depend on them
      - name: Configure
        run: |
          cmake -S . -B build \
            -DFLAVOUR=CoInterpreter \
            -DPHARO_DEPENDENCIES_PREFER_DOWNLOAD_BINARIES=TRUE \
            -DICEBERG_DEFAULT_REMOTE=httpsUrl \
            -DBUILD_WITH_GRAPHVIZ=OFF \
            -DFEATURE_LIB_CAIRO=OFF \
            -DFEATURE_LIB_FREETYPE2=OFF

      - name: Check that CMake uses clang and clang++
        run: sh scripts/check-clang.sh build

      - name: Generate
        run: cmake --build build --target generate-sources

      # Under build/ (the common directory of the paths), as the Windows job
      # downloads them: build/generated, build/build/vmmaker/image
      - uses: actions/upload-artifact@v7
        with:
          name: generated-sources
          path: |
            build/generated
            build/build/vmmaker/image/VMMaker.image
            build/build/vmmaker/image/VMMaker.changes
            build/build/vmmaker/image/*.sources
          if-no-files-found: error
          retention-days: 1

  # x86_64 on windows-2025 (MSYS2 UCRT64), arm64 on windows-11-arm (MSYS2
  # CLANGARM64): there bash, git and the other MSYS tools run under the x64
  # emulation of Windows 11, but not VMMaker (generate: OFF), whose sources
  # and image come from the generate job
  windows:
    name: Windows ${{ matrix.arch }} (MSYS2 ${{ matrix.msystem }})
    needs: generate
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 150
    strategy:
      fail-fast: false
      matrix:
        include:
          - { arch: x86_64, runner: windows-2025,   msystem: UCRT64,     machine: '8664', generate: 'ON' }
          - { arch: arm64,  runner: windows-11-arm, msystem: CLANGARM64, machine: 'AA64', generate: 'OFF' }
    defaults:
      run:
        shell: msys2 {0}
    steps:
      # The Smalltalk sources VMMaker reads must keep their LF line endings
      # (.gitattributes has `* text=auto`)
      - name: Keep LF line endings
        shell: pwsh
        run: |
          git config --global core.autocrlf false
          git config --global core.eol lf

      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      # clang, not gcc: the Windows flags of CMakeLists.txt have -fdeclspec.
      # libgit2-winhttp does HTTPS with the certificates of Windows.
      # :p is the package prefix of the msystem (mingw-w64-ucrt-x86_64-,
      # mingw-w64-clang-aarch64-); CLANGARM64 has the C++ runtime libc++
      # (with libunwind) and the objdump of LLVM, not GNU binutils.  No cairo
      # or freetype: the zip has MSYS2's packages pinned in
      # cmake/cairo-stack/pins.txt (scripts/cairo-stack/fetch-msys2.sh, which
      # needs the curl, zstd and tar of MSYS2's base)
      - uses: msys2/setup-msys2@ec48f7c5447b3140e2b088413ae3a55687bccb6e # v2.33.0
        with:
          msystem: ${{ matrix.msystem }}
          update: true
          install: git
          pacboy: >-
            clang:p
            cmake:p
            ninja:p
            libffi:p
            libgit2-winhttp:p
            SDL2:p
            sdl3:p

      - name: Fetch the release tags
        run: |
          git config --global --add safe.directory '*'
          git fetch --no-tags --force https://github.com/pharo-project/pharo-vm.git '+refs/tags/v*:refs/tags/v*'
          git describe --tags --match 'v[0-9]*'

      # GENERATED_SOURCE_DIR defaults to build, where these land
      - if: matrix.generate == 'OFF'
        uses: actions/download-artifact@v8
        with:
          name: generated-sources
          path: build

      # The cairo stack of arm64: MSYS2's pinned packages, each checked
      # against its SHA256 before anything is extracted, cached as on Linux
      # by the pins and the scripts (the packages are binaries: the toolchain
      # of the runner does not change them).  x86_64 has neither step: its
      # Build runs the same script through the ExternalProject of
      # cmake/cairoStack.cmake, the path of a developer's build
      - name: Restore the cairo stack
        id: cache
        if: ${{ matrix.arch == 'arm64' && !(github.event_name == 'push' && github.ref == 'refs/heads/pharo-12') }}
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/cairo-stack
          key: cairo-stack-${{ runner.os }}-${{ matrix.arch }}-${{ hashFiles('cmake/cairo-stack/**', 'scripts/cairo-stack/**') }}-msys2

      - name: Fetch the cairo stack
        if: matrix.arch == 'arm64' && steps.cache.outputs.cache-hit != 'true'
        run: |
          t=$(cygpath -u "$RUNNER_TEMP")
          sh scripts/cairo-stack/fetch-msys2.sh --arch ${{ matrix.arch }} --prefix "$t/cairo-stack" \
            --work "$t/cairo-stack-work" --downloads "$t/cairo-stack-dl"

      # CMake checks the manifest of the arm64 stack (pins, platform,
      # architecture); on x86_64 it writes build/cairo-stack/build-stack.sh,
      # which the Build runs
      - name: Configure
        run: |
          t=$(cygpath -u "$RUNNER_TEMP")
          stack=()
          if [ "${{ matrix.arch }}" = arm64 ]; then
            stack=(-DPHARO_CAIRO_STACK_DIR="$(cygpath -m "$RUNNER_TEMP")/cairo-stack")
          fi
          cmake -S . -B build -G Ninja \
            -DCMAKE_C_COMPILER=clang \
            -DCMAKE_CXX_COMPILER=clang++ \
            -DFLAVOUR=CoInterpreter \
            -DGENERATE_SOURCES=${{ matrix.generate }} \
            -DICEBERG_DEFAULT_REMOTE=httpsUrl \
            -DBUILD_WITH_GRAPHVIZ=OFF \
            "${stack[@]}" | tee "$t/configure.txt"
          if [ "${{ matrix.arch }}" = arm64 ]; then
            grep -q 'PHARO_CAIRO_STACK_DIR, manifest checked' "$t/configure.txt"
          else
            grep -q 'cairo stack: built from' "$t/configure.txt"
          fi

      - name: Check that CMake uses clang and clang++
        run: sh scripts/check-clang.sh build

      - name: Build
        run: cmake --build build

      - name: Package
        run: cmake --build build --target package

      # The file system ignores case, the globs below and the release do not
      # tell Windows-ARM64 from Windows-arm64: check the name exactly
      - name: Drop the commit count from the name of the zip
        run: |
          cd build/build/packages
          for zip in PharoVM-*-bin.zip; do mv "$zip" "$(echo "$zip" | sed -E 's/\+[0-9]+\./-/')"; done
          ls PharoVM-*-bin.zip
          ls PharoVM-*-bin.zip | grep -q -- '-Windows-${{ matrix.arch }}-bin\.zip$'

      # Outside of MSYS2, with only the zip and the system directories in the
      # PATH, so that a DLL missing from the zip makes this step fail: load
      # every DLL of the zip (the image loads cairo, SDL2, libgit2... through
      # FFI), then run the VMMaker image (--version stops before loading one)
      - name: Run the VM of the zip
        shell: pwsh
        run: |
          $vm = "$env:RUNNER_TEMP\vm"
          $zip = Get-ChildItem build/build/packages/PharoVM-*-Windows-${{ matrix.arch }}-bin.zip
          Expand-Archive -Path $zip.FullName -DestinationPath $vm
          $env:PATH = "$vm;$env:SystemRoot\System32;$env:SystemRoot"
          Get-ChildItem "$vm\*.dll" | ForEach-Object {
            [System.Runtime.InteropServices.NativeLibrary]::Load($_.FullName) | Out-Null
          }
          & "$vm\PharoConsole.exe" --version
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $out = & "$vm\PharoConsole.exe" --headless build/build/vmmaker/image/VMMaker.image --no-default-preferences eval '3 + 4'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $out
          if (-not ($out -contains '7')) { exit 1 }

      # An x64 VM would also run on windows-11-arm, emulated: every exe and
      # DLL of the zip must be of the machine of the runner (PE header)
      - name: Check the machine of the binaries of the zip
        shell: pwsh
        run: |
          $want = [Convert]::ToUInt16('${{ matrix.machine }}', 16)
          $bad = 0
          Get-ChildItem "$env:RUNNER_TEMP\vm\*.exe", "$env:RUNNER_TEMP\vm\*.dll" | ForEach-Object {
            $b = [System.IO.File]::ReadAllBytes($_.FullName)
            $m = [BitConverter]::ToUInt16($b, [BitConverter]::ToInt32($b, 0x3C) + 4)
            if ($m -ne $want) { "{0}: machine 0x{1:X4}" -f $_.Name, $m; $bad++ }
          }
          exit $bad

      # As on Linux, for the DLLs next to the exe: every DLL of the pinned
      # closure is there, with the SHA256 of its pinned package (not a DLL of
      # the same name of another MSYS2 package of the runner), and their
      # imports are the closure, the C/C++ runtime and Windows (an
      # allow-list: no liblzo2, no cairo-gobject or script interpreter); the
      # exports the images bind; the machine; the notices
      - name: Check the cairo stack of the zip
        run: |
          t=$(cygpath -u "$RUNNER_TEMP")
          sh scripts/cairo-stack/check.sh --bundle "$t/vm" --platform mingw --arch ${{ matrix.arch }} | tee "$t/cairo-stack-check.txt"

      # With the same PATH: the C++ runtime DLLs of the plugin must be in the zip
      - name: Load the SimdJSONPlugin of the zip
        shell: pwsh
        run: |
          $vm = "$env:RUNNER_TEMP\vm"
          $env:PATH = "$vm;$env:SystemRoot\System32;$env:SystemRoot"
          $out = & "$vm\PharoConsole.exe" --headless build/build/vmmaker/image/VMMaker.image --no-default-preferences st plugins/SimdJSONPlugin/tests/ci-load.st
          if ($LASTEXITCODE -ne 0) { $out; exit $LASTEXITCODE }
          $out
          if (-not ($out -match '^SimdJSONPlugin native ')) { exit 1 }

      # The same for the SimdUTFPlugin, with SIMDUTF_FORCE_IMPLEMENTATION unset,
      # bogus (refused) and fallback (honoured on x64; arm64 has no other
      # kernel).  simdutf has never run on Windows arm64 upstream.  The
      # licence files are next to the plugins
      - name: Load the SimdUTFPlugin of the zip
        shell: pwsh
        run: |
          $vm = "$env:RUNNER_TEMP\vm"
          $env:PATH = "$vm;$env:SystemRoot\System32;$env:SystemRoot"
          function Probe {
            $out = & "$vm\PharoConsole.exe" --headless build/build/vmmaker/image/VMMaker.image --no-default-preferences st plugins/SimdUTFPlugin/tests/ci-load.st
            if ($LASTEXITCODE -ne 0) { $out; exit $LASTEXITCODE }
            $out
          }
          $out = Probe
          $out
          if (-not ($out -match '^SimdUTFPlugin native ')) { exit 1 }
          $env:SIMDUTF_FORCE_IMPLEMENTATION = 'bogus'
          $out = Probe
          $out
          if (-not ($out -match '^SimdUTFPlugin native .* forced refused bogus ok')) { exit 1 }
          $env:SIMDUTF_FORCE_IMPLEMENTATION = 'fallback'
          $out = Probe
          $out
          if ('${{ matrix.machine }}' -eq '8664') {
            if (-not ($out -match '^SimdUTFPlugin native fallback .* forced fallback ok')) { exit 1 }
          } else {
            if (-not ($out -match '^SimdUTFPlugin native arm64 .* forced refused fallback ok')) { exit 1 }
          }
          Remove-Item Env:SIMDUTF_FORCE_IMPLEMENTATION
          foreach ($f in 'LICENSE.simdutf', 'LICENSE.simdutf-MIT', 'LICENSE.simdutf-isadetection', 'LICENSE.simdjson-isadetection') {
            if (-not (Test-Path "$vm\$f")) { "missing $f"; exit 1 }
          }

      # The same for the TimSortPlugin and libTimSortFFI (TimSortFFI.dll, or
      # libTimSortFFI.dll as MinGW names it): there the resumable sort runs on
      # Fibers, on x64 and on arm64, and has never run before this step
      - name: Load the TimSortPlugin and libTimSortFFI of the zip
        shell: pwsh
        run: |
          $vm = "$env:RUNNER_TEMP\vm"
          $env:PATH = "$vm;$env:SystemRoot\System32;$env:SystemRoot"
          $out = & "$vm\PharoConsole.exe" --headless build/build/vmmaker/image/VMMaker.image --no-default-preferences st plugins/TimSortPlugin/tests/ci-load.st
          if ($LASTEXITCODE -ne 0) { $out; exit $LASTEXITCODE }
          $out
          if (-not ($out -match '^TimSortPlugin native timsort\.c [0-9a-f]* coroutines yes [0-9]* ok')) { exit 1 }
          if (-not ($out -match '^TimSortFFI 1 [0-9a-f]* fibers coroutines yes [0-9]* ok')) { exit 1 }
          if (-not (Test-Path "$vm\LICENSE.timsort")) { "missing LICENSE.timsort"; exit 1 }

      - name: Load the UtilsPlugin of the zip
        shell: pwsh
        run: |
          $vm = "$env:RUNNER_TEMP\vm"
          $env:PATH = "$vm;$env:SystemRoot\System32;$env:SystemRoot"
          $out = & "$vm\PharoConsole.exe" --headless build/build/vmmaker/image/VMMaker.image --no-default-preferences st plugins/UtilsPlugin/tests/ci-load.st
          if ($LASTEXITCODE -ne 0) { $out; exit $LASTEXITCODE }
          $out
          if (-not ($out -match '^UtilsPlugin native 1 ok')) { exit 1 }

      # As on Linux, with the same PATH: the CairoPlugin (CairoPlugin.dll, or
      # libCairoPlugin.dll as MinGW names it) bound to the libcairo of the
      # zip (MSYS2's build of the pinned cairo), with the C++ runtime DLLs of
      # the zip for the engine of its text.  The toy text goes through DWrite,
      # and through cairo's TLS callback, which plain 1.18.6 built by MinGW
      # does not link (MSYS2 patches it)
      - name: Load the CairoPlugin of the zip
        shell: pwsh
        run: |
          $vm = "$env:RUNNER_TEMP\vm"
          $env:PATH = "$vm;$env:SystemRoot\System32;$env:SystemRoot"
          $pin = Select-String -Path cmake/cairo-stack/pins.txt -Pattern '^cairo\s+(\S+)' | Select-Object -First 1
          if (-not $pin) { "no cairo line in cmake/cairo-stack/pins.txt"; exit 1 }
          $cairo = [regex]::Escape($pin.Matches[0].Groups[1].Value)
          $out = & "$vm\PharoConsole.exe" --headless build/build/vmmaker/image/VMMaker.image --no-default-preferences st plugins/CairoPlugin/tests/ci-load.st
          if ($LASTEXITCODE -ne 0) { $out; exit $LASTEXITCODE }
          $out
          if (-not ($out -match "^CairoPlugin native 1 cairo $cairo ok")) { exit 1 }
          if (-not ($out -match '^CairoToy ok family .+ ink [1-9][0-9]*( |$)')) { exit 1 }
          if (-not ((Test-Path "$vm\CairoPlugin.dll") -or (Test-Path "$vm\libCairoPlugin.dll"))) { "missing CairoPlugin.dll"; exit 1 }

      - uses: actions/upload-artifact@v7
        with:
          path: build/build/packages/PharoVM-*-Windows-${{ matrix.arch }}-bin.zip
          archive: false
          if-no-files-found: error

  wasm:
    name: WebAssembly
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    env:
      # The version the port needs (docs/WebAssembly.md)
      EMSDK_VERSION: 6.0.10
      # The images of the site (docs/WebAssembly.md, Pharo versions): 15 is the default
      PHARO15_URL: https://files.pharo.org/image/150/Pharo15.0-SNAPSHOT.build.117.sha.053a562682.arch.64bit.zip
      PHARO15_SHA256: fda94ce83896bd3db02c19f4af322fda8ad2446c945489ead92f317373d9452b
      PHARO14_URL: https://files.pharo.org/image/140/Pharo14.0-SNAPSHOT.build.785.sha.74f3a1b398.arch.64bit.zip
      PHARO14_SHA256: 5396878ea912f87ce99fdbb7137e01a8122745b690a2ee6949338c0aa438b0ea
      PHARO13_URL: https://files.pharo.org/image/130/Pharo13.0-SNAPSHOT.build.749.sha.d7c6f761d5.arch.64bit.zip
      PHARO13_SHA256: 31991e50d6ddbb19170d35fabc6d1fb0a8e95ea311b69b079109426e3fec76ae
      # Pharo 15 builds 41 and 50, the images of the site before: only their .sources are staged, for the images saved on them
      PHARO15B41_URL: https://files.pharo.org/image/150/Pharo15.0-SNAPSHOT.build.41.sha.4e572fed79.arch.64bit.zip
      PHARO15B41_SHA256: 8ce97d8d8a1b466a4a591d52a8f9f5822e2cff03669eacf91713b8f29db46727
      PHARO15B50_URL: https://files.pharo.org/image/150/Pharo15.0-SNAPSHOT.build.50.sha.b85960fcc6.arch.64bit.zip
      PHARO15B50_SHA256: 27164cb9c16685c108df4d2b11106fd6d26a62f37b3e39bb7bfabd176336f036
      # The native tree of build-wasm/host, which generates the sources;
      # the toolchain file of emcmake makes the wasm tree use emcc and em++
      CC: clang
      CXX: clang++
    steps:
      # (with the submodules plugins/SimdJSONPlugin/simdjson.st,
      # plugins/SimdUTFPlugin/simdutf.st, plugins/TimSortPlugin/timsort.st and
      # plugins/UtilsPlugin/vm-plugins-primitives.st, the Smalltalk code that
      # lanes 68, 69, 71, 73 and 74 of wasm-check load; 74 the packages of
      # the CairoPlugin, from vm-plugins-primitives.st too)
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
          submodules: true

      - name: Fetch the release tags
        run: |
          git fetch --no-tags --force https://github.com/pharo-project/pharo-vm.git '+refs/tags/v*:refs/tags/v*'
          git describe --tags --match 'v[0-9]*'

      - name: Install clang
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends clang

      - name: Install Emscripten
        run: |
          git clone --depth 1 https://github.com/emscripten-core/emsdk.git "$RUNNER_TEMP/emsdk"
          "$RUNNER_TEMP/emsdk/emsdk" install "$EMSDK_VERSION"
          "$RUNNER_TEMP/emsdk/emsdk" activate "$EMSDK_VERSION"

      # (under their own names, from which stage.mjs reads the build of each)
      - name: Download the Pharo images
        run: |
          mkdir -p "$RUNNER_TEMP/images" "$RUNNER_TEMP/legacy"
          for v in 15 14 13 15B41 15B50; do
            eval "url=\$PHARO${v}_URL sha=\$PHARO${v}_SHA256"
            f="$RUNNER_TEMP/images/$(basename "$url")"
            curl -fsSL -o "$f" "$url"
            echo "$sha  $f" | sha256sum -c -
            echo "PHARO${v}_ZIP=$f" >> "$GITHUB_ENV"
          done
          for v in 15B41 15B50; do
            eval "url=\$PHARO${v}_URL"
            unzip -j -o "$RUNNER_TEMP/images/$(basename "$url")" '*.sources' -d "$RUNNER_TEMP/legacy"
          done
          # (one line of GITHUB_ENV: the files separated by blanks)
          echo "PHARO_LEGACY_SOURCES=$(echo "$RUNNER_TEMP"/legacy/*.sources)" >> "$GITHUB_ENV"

      # make wasm records its settings but does not remember them: give
      # wasm-check the same ones, or it builds the defaults again.  The node
      # VM (wasm64, a 64-bit table) needs node 24.15 or later: the node of
      # emsdk (EMSDK_NODE), which emsdk_env.sh leaves off the PATH, and not
      # the node 22 of the runner
      - name: Build
        run: |
          source "$RUNNER_TEMP/emsdk/emsdk_env.sh"
          export PATH="$(dirname "$EMSDK_NODE"):$PATH"
          node --version
          make wasm WASM_IMAGE_ZIP="$PHARO15_ZIP" WASM_IMAGE_ID=p15 \
            WASM_EXTRA_IMAGES="p13=$PHARO13_ZIP p14=$PHARO14_ZIP" \
            WASM_EXTRA_SOURCES="$PHARO_LEGACY_SOURCES" WASM_LIBGIT2=ON

      - name: Check that CMake uses clang and clang++
        run: sh scripts/check-clang.sh build-wasm/host build-wasm/cmake

      - name: Run the node test lanes
        run: |
          source "$RUNNER_TEMP/emsdk/emsdk_env.sh"
          export PATH="$(dirname "$EMSDK_NODE"):$PATH"
          make wasm-check WASM_IMAGE_ZIP="$PHARO15_ZIP" WASM_IMAGE_ID=p15 \
            WASM_EXTRA_IMAGES="p13=$PHARO13_ZIP p14=$PHARO14_ZIP" \
            WASM_EXTRA_SOURCES="$PHARO_LEGACY_SOURCES" WASM_LIBGIT2=ON

      # The logs of the lanes (and the stderr of the VMs of the failed cases,
      # kept in their directories), which the job log shows only in part
      - name: Keep the logs of the lanes
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: wasm-check-logs
          path: |
            build-wasm/tests-run/**/*.log
            build-wasm/tests-run/**/*.err
            build-wasm/tests-run/**/*.out
            build-wasm/tests-run/**/*.txt
          if-no-files-found: ignore
          retention-days: 14

      - name: Package
        run: |
          version=$(cut -d'*' -f1 build-wasm/cmake/version.info | sed -E 's/\+[0-9]+\./-/')
          sha=$(cut -d'*' -f8 build-wasm/cmake/version.info)
          name=PharoVM-$version-WebAssembly
          mkdir -p "dist/$name"
          cp -R build-wasm/web build-wasm/node packaging/emscripten/tools/serve.mjs \
            packaging/emscripten/dist/node-try.sh "dist/$name/"
          sed "s/@PHAROVM_COMMIT@/$sha/" packaging/emscripten/dist/README.md > "dist/$name/README.md"
          du -sh build-wasm/web/image/*
          cd dist && zip -qr "$name-bin.zip" "$name"
          ls -l "$name-bin.zip"

      - uses: actions/upload-artifact@v7
        with:
          path: dist/PharoVM-*-WebAssembly-bin.zip
          archive: false
          if-no-files-found: error

  # The pins of the cairo stack (scripts/cairo-stack/check-pins.sh): well
  # formed, one version per library on every VM (the wasm pins of
  # cmake/emscripten/deps included), and every URL still answers (MSYS2
  # removes superseded packages after a while).  Then the sources of the
  # stack, which the release attaches next to the zips (decision U10, the
  # source offer of THIRD-PARTY-NOTICES.cairo-stack.txt), each file checked
  # against pins.txt: the pinned archives, MSYS2's source packages of the
  # Windows closure (but those of the C/C++ runtime, under the GCC and LLVM
  # runtime exceptions: about 350 MB), and cmake/cairo-stack and
  # scripts/cairo-stack
  cairo-stack:
    name: Cairo stack pins and sources
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Check the pins
        run: sh scripts/cairo-stack/check-pins.sh

      # The files are checked against pins.txt each time they are used, so a
      # cached copy is as good as a download, and outlives the package's
      # removal from MSYS2's repository while the cache lives
      - name: Restore the downloads of the cairo stack
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/cairo-stack-dl
          key: cairo-stack-sources-${{ hashFiles('cmake/cairo-stack/pins.txt') }}

      - name: Gather the sources of the cairo stack
        run: |
          command -v zstd > /dev/null || { sudo apt-get update && sudo apt-get install -y --no-install-recommends zstd; }
          pins=cmake/cairo-stack/pins.txt
          dl="$RUNNER_TEMP/cairo-stack-dl"
          out="$RUNNER_TEMP/cairo-stack-sources"
          mkdir -p "$dl/archives" "$out/archives" "$out/msys2"
          awk '!/^#/ && NF >= 7 && $1 != "mirror" && $1 != "native-ahead" && $1 !~ /^msys2/ { print $1, $3, $4, $5 }' "$pins" > "$RUNNER_TEMP/archives.txt"
          test -s "$RUNNER_TEMP/archives.txt"
          while read -r name sha file url; do
            if [ ! -f "$dl/archives/$file" ]; then
              mirror=$(awk -v n="$name" '$1 == "mirror" && $2 == n { print $3; exit }' "$pins")
              curl -fsSL --proto '=https' --tlsv1.2 --retry 3 -o "$dl/archives/$file" "$url" ||
                { test -n "$mirror" && curl -fsSL --proto '=https' --tlsv1.2 --retry 3 -o "$dl/archives/$file" "$mirror"; }
            fi
            echo "$sha  $dl/archives/$file" | sha256sum -c -
            cp "$dl/archives/$file" "$out/archives/"
          done < "$RUNNER_TEMP/archives.txt"
          for env in ucrt64 clangarm64; do
            sh scripts/cairo-stack/fetch-msys2.sh --env "$env" --prefix "$RUNNER_TEMP/msys2-$env" \
              --work "$RUNNER_TEMP/msys2-$env-work" --downloads "$dl/msys2" \
              --sources "$dl/msys2-sources" --no-runtime-sources
          done
          # (the cache is keyed by pins.txt: only pinned files are there)
          cp "$dl/msys2-sources"/* "$out/msys2/"
          mkdir -p "$out/cmake" "$out/scripts"
          cp -R cmake/cairo-stack "$out/cmake/"
          cp -R scripts/cairo-stack "$out/scripts/"
          (cd "$out" && find . -type f | LC_ALL=C sort | xargs sha256sum) > "$RUNNER_TEMP/SHA256SUMS"
          mv "$RUNNER_TEMP/SHA256SUMS" "$out/"
          tar -cf "$RUNNER_TEMP/cairo-stack-sources.tar" -C "$RUNNER_TEMP" cairo-stack-sources
          ls -l "$out/archives" "$out/msys2" "$RUNNER_TEMP/cairo-stack-sources.tar"

      - uses: actions/upload-artifact@v7
        with:
          name: cairo-stack-sources
          path: ${{ runner.temp }}/cairo-stack-sources.tar
          compression-level: 0
          if-no-files-found: error
          retention-days: 1

  # The site of the WebAssembly zip, deployed to GitHub Pages directly from
  # the workflow (Settings > Pages > Build and deployment > Source must be
  # set to GitHub Actions).
  pages:
    name: GitHub Pages
    if: github.event_name == 'push' && github.ref == 'refs/heads/pharo-12'
    needs: wasm
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: PharoVM-*-WebAssembly-bin.zip
          path: artifacts
          skip-decompress: true

      - name: Check the site of the zip
        run: |
          # one artifact is saved in artifacts itself, several each in a
          # directory of its own: take the one file wherever it is
          zip=$(find artifacts -type f)
          test -n "$zip"
          test "$(echo "$zip" | wc -l)" -eq 1
          unzip -q "$zip" -d unpacked
          mkdir site
          cp -R unpacked/PharoVM-*-WebAssembly/web/. site/
          # every file of the manifest is there and as large as it says
          node -e 'const fs=require("fs"),m=JSON.parse(fs.readFileSync("site/manifest.json"));
            const all=[...m.files,...(m.images||[]).flatMap(i=>i.files),...(m.extraSources||[])];
            for(const f of all){const s=fs.statSync("site/"+f.url).size; if(s!==f.gzSize) throw new Error("bad "+f.url);}
            if(!m.images||m.images.length!==3) throw new Error("expected 3 images");'
          du -sh site

      - uses: actions/upload-pages-artifact@v5
        with:
          path: site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5

  release:
    name: Release
    if: github.event_name == 'push' && github.ref == 'refs/heads/pharo-12'
    needs: [linux, macos, windows, wasm, cairo-stack]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      # Each artifact is a zip uploaded as is: keep it, in a directory named
      # after it (with skip-decompress the file itself may be named artifact)
      - uses: actions/download-artifact@v8
        with:
          pattern: PharoVM-*
          path: artifacts
          skip-decompress: true

      # The sources of the cairo stack (the cairo-stack job), attached to the
      # release next to the zips
      - uses: actions/download-artifact@v8
        with:
          name: cairo-stack-sources
          path: sources

      - name: Publish the zips as a release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          mkdir zips
          for dir in artifacts/*/; do
            mv "$dir"* "zips/$(basename "$dir")"
          done
          ls -l zips
          test "$(ls zips | wc -l)" -eq 7
          tags=$(ls zips | sed -E 's/-(Linux-[^-]+|Darwin-[^-]+|Windows-[^-]+|WebAssembly)-bin\.zip$//' | sort -u)
          test "$(echo "$tags" | wc -l)" -eq 1
          tag=$tags
          ls -l sources
          test -f sources/cairo-stack-sources.tar
          if gh release view "$tag" > /dev/null 2>&1; then
            gh release upload "$tag" zips/* sources/cairo-stack-sources.tar --clobber
          else
            gh release create "$tag" zips/* sources/cairo-stack-sources.tar \
              --target "$GITHUB_SHA" \
              --title "$tag" \
              --notes "The Pharo VM built from $GITHUB_SHA ($GITHUB_REF_NAME) by $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          fi
