# Build the Pharo VM (CoInterpreter, sources generated by VMMaker on each
# runner) and upload the CPack bin zip of each platform as an artifact:
#
#   PharoVM-<version>-Linux-x86_64-bin.zip     ubuntu-24.04
#   PharoVM-<version>-Linux-aarch64-bin.zip    ubuntu-24.04-arm
#   PharoVM-<version>-Darwin-x86_64-bin.zip    macos-15-intel
#   PharoVM-<version>-Darwin-arm64-bin.zip     macos-15
#   PharoVM-<version>-Windows-x86_64-bin.zip   windows-2025, MSYS2 UCRT64
#
# Linux and macOS bundle the prebuilt libraries of files.pharo.org
# (PHARO_DEPENDENCIES_PREFER_DOWNLOAD_BINARIES), Windows the DLLs of the
# MSYS2 packages (cmake/importMinGWDependencies.cmake).
#
# <version> comes from `git describe` (cmake/versionExtraction.cmake), so
# every job checks out the whole history and fetches the release tags of
# pharo-project/pharo-vm, which a fork may not have.

name: Build

on:
  push:
    paths-ignore: ['docs/**', '**/*.md']
  pull_request:
    paths-ignore: ['docs/**', '**/*.md']

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linux:
    name: Linux ${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        include:
          - { arch: x86_64,  runner: ubuntu-24.04 }
          - { arch: aarch64, runner: ubuntu-24.04-arm }
    env:
      CC: clang
      CXX: clang++
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Fetch the release tags
        run: |
          git fetch --no-tags --force https://github.com/pharo-project/pharo-vm.git '+refs/tags/v*:refs/tags/v*'
          git describe --tags

      - name: Install the dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends clang cmake make unzip uuid-dev libssl-dev

      - name: Configure
        run: |
          cmake -S . -B build \
            -DFLAVOUR=CoInterpreter \
            -DPHARO_DEPENDENCIES_PREFER_DOWNLOAD_BINARIES=TRUE \
            -DICEBERG_DEFAULT_REMOTE=httpsUrl \
            -DBUILD_WITH_GRAPHVIZ=OFF

      - name: Build
        run: cmake --build build --parallel "$(nproc)"

      - name: Package
        run: cmake --build build --target package

      # --version stops before loading an image: also run the VMMaker image
      - name: Run the VM of the zip
        run: |
          unzip -q build/build/packages/PharoVM-*-Linux-${{ matrix.arch }}-bin.zip -d "$RUNNER_TEMP/vm"
          "$RUNNER_TEMP/vm/pharo" --version
          "$RUNNER_TEMP/vm/pharo" --headless build/build/vmmaker/image/VMMaker.image --no-default-preferences eval '3 + 4' | tee "$RUNNER_TEMP/eval.txt"
          grep -qx 7 "$RUNNER_TEMP/eval.txt"

      - uses: actions/upload-artifact@v7
        with:
          path: build/build/packages/PharoVM-*-Linux-${{ matrix.arch }}-bin.zip
          archive: false
          if-no-files-found: error

  macos:
    name: macOS ${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        include:
          - { arch: x86_64, runner: macos-15-intel }
          - { arch: arm64,  runner: macos-15 }
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Fetch the release tags
        run: |
          git fetch --no-tags --force https://github.com/pharo-project/pharo-vm.git '+refs/tags/v*:refs/tags/v*'
          git describe --tags

      # The platform name of the zip and the prebuilt libraries follow the
      # host, not CMAKE_OSX_ARCHITECTURES
      - name: Check the architecture of the runner
        run: test "$(uname -m)" = "${{ matrix.arch }}"

      # On arm64 the VM uses the libffi of the system, as upstream does
      # (FindFFI does not look into the SDK by itself)
      - name: Configure
        run: |
          extra=()
          if [ "${{ matrix.arch }}" = arm64 ]; then
            sdk="$(xcrun --show-sdk-path)"
            extra=(-DFFI_LIBRARY="$sdk/usr/lib/libffi.tbd" -DFFI_INCLUDE_DIR="$sdk/usr/include/ffi")
          fi
          cmake -S . -B build \
            -DFLAVOUR=CoInterpreter \
            -DPHARO_DEPENDENCIES_PREFER_DOWNLOAD_BINARIES=TRUE \
            -DICEBERG_DEFAULT_REMOTE=httpsUrl \
            -DBUILD_WITH_GRAPHVIZ=OFF \
            -DCMAKE_OSX_ARCHITECTURES=${{ matrix.arch }} \
            -DCMAKE_OSX_SYSROOT=macosx \
            "${extra[@]}"

      - name: Build
        run: cmake --build build --parallel "$(sysctl -n hw.ncpu)"

      - name: Package
        run: cmake --build build --target package

      # --version stops before loading an image: also run the VMMaker image
      - name: Run the VM of the zip
        run: |
          unzip -q build/build/packages/PharoVM-*-Darwin-${{ matrix.arch }}-bin.zip -d "$RUNNER_TEMP/vm"
          "$RUNNER_TEMP/vm/Pharo.app/Contents/MacOS/Pharo" --headless --version
          "$RUNNER_TEMP/vm/Pharo.app/Contents/MacOS/Pharo" --headless build/build/vmmaker/image/VMMaker.image --no-default-preferences eval '3 + 4' | tee "$RUNNER_TEMP/eval.txt"
          grep -qx 7 "$RUNNER_TEMP/eval.txt"

      - uses: actions/upload-artifact@v7
        with:
          path: build/build/packages/PharoVM-*-Darwin-${{ matrix.arch }}-bin.zip
          archive: false
          if-no-files-found: error

  windows:
    name: Windows x86_64 (MSYS2 UCRT64)
    runs-on: windows-2025
    timeout-minutes: 150
    defaults:
      run:
        shell: msys2 {0}
    steps:
      # The Smalltalk sources VMMaker reads must keep their LF line endings
      # (.gitattributes has `* text=auto`)
      - name: Keep LF line endings
        shell: pwsh
        run: |
          git config --global core.autocrlf false
          git config --global core.eol lf

      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      # clang, not gcc: the Windows flags of CMakeLists.txt have -fdeclspec.
      # libgit2-winhttp does HTTPS with the certificates of Windows.
      - uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: git
          pacboy: >-
            clang:p
            cmake:p
            ninja:p
            libffi:p
            libgit2-winhttp:p
            freetype:p
            cairo:p
            SDL2:p
            sdl3:p

      - name: Fetch the release tags
        run: |
          git config --global --add safe.directory '*'
          git fetch --no-tags --force https://github.com/pharo-project/pharo-vm.git '+refs/tags/v*:refs/tags/v*'
          git describe --tags

      - name: Configure
        run: |
          cmake -S . -B build -G Ninja \
            -DCMAKE_C_COMPILER=clang \
            -DCMAKE_CXX_COMPILER=clang++ \
            -DFLAVOUR=CoInterpreter \
            -DICEBERG_DEFAULT_REMOTE=httpsUrl \
            -DBUILD_WITH_GRAPHVIZ=OFF

      - name: Build
        run: cmake --build build

      - name: Package
        run: cmake --build build --target package

      # Outside of MSYS2, with only the zip and the system directories in the
      # PATH, so that a DLL missing from the zip makes this step fail: load
      # every DLL of the zip (the image loads cairo, SDL2, libgit2... through
      # FFI), then run the VMMaker image (--version stops before loading one)
      - name: Run the VM of the zip
        shell: pwsh
        run: |
          $vm = "$env:RUNNER_TEMP\vm"
          $zip = Get-ChildItem build/build/packages/PharoVM-*-Windows-x86_64-bin.zip
          Expand-Archive -Path $zip.FullName -DestinationPath $vm
          $env:PATH = "$vm;$env:SystemRoot\System32;$env:SystemRoot"
          Get-ChildItem "$vm\*.dll" | ForEach-Object {
            [System.Runtime.InteropServices.NativeLibrary]::Load($_.FullName) | Out-Null
          }
          & "$vm\PharoConsole.exe" --version
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $out = & "$vm\PharoConsole.exe" --headless build/build/vmmaker/image/VMMaker.image --no-default-preferences eval '3 + 4'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $out
          if (-not ($out -contains '7')) { exit 1 }

      - uses: actions/upload-artifact@v7
        with:
          path: build/build/packages/PharoVM-*-Windows-x86_64-bin.zip
          archive: false
          if-no-files-found: error
