<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">
<!-- The fonts of Pango and Poppler in Pharo's WebAssembly VM
     (cmake/emscripten/deps/pango.cmake): the DejaVu fonts next to this
     file, with the generic families, the base-14 families of PDF and any
     other family mapped to them.  No cache: fontconfig scans the five
     fonts when it starts. -->
<fontconfig>
  <dir prefix="relative">.</dir>
  <alias binding="same"><family>sans-serif</family><prefer><family>DejaVu Sans</family></prefer></alias>
  <alias binding="same"><family>sans</family><prefer><family>DejaVu Sans</family></prefer></alias>
  <alias binding="same"><family>serif</family><prefer><family>DejaVu Serif</family></prefer></alias>
  <alias binding="same"><family>monospace</family><prefer><family>DejaVu Sans Mono</family></prefer></alias>
  <alias binding="same"><family>mono</family><prefer><family>DejaVu Sans Mono</family></prefer></alias>
  <alias binding="same"><family>Helvetica</family><prefer><family>DejaVu Sans</family></prefer></alias>
  <alias binding="same"><family>Arial</family><prefer><family>DejaVu Sans</family></prefer></alias>
  <alias binding="same"><family>Times</family><prefer><family>DejaVu Serif</family></prefer></alias>
  <alias binding="same"><family>Times New Roman</family><prefer><family>DejaVu Serif</family></prefer></alias>
  <alias binding="same"><family>Courier</family><prefer><family>DejaVu Sans Mono</family></prefer></alias>
  <alias binding="same"><family>Courier New</family><prefer><family>DejaVu Sans Mono</family></prefer></alias>
  <!-- any other family: DejaVu Sans -->
  <match target="pattern"><edit name="family" mode="append_last"><string>DejaVu Sans</string></edit></match>
  <!-- the oblique faces, and the bold ones of DejaVu Sans Mono, are
       synthesized (fontconfig's 90-synthetic.conf) -->
  <match target="font">
    <test name="slant" compare="eq"><const>roman</const></test>
    <test target="pattern" name="slant" compare="not_eq"><const>roman</const></test>
    <edit name="matrix" mode="assign"><times><name>matrix</name><matrix><double>1</double><double>0.2</double><double>0</double><double>1</double></matrix></times></edit>
    <edit name="slant" mode="assign"><const>oblique</const></edit>
    <edit name="embeddedbitmap" mode="assign"><bool>false</bool></edit>
  </match>
  <match target="font">
    <test name="weight" compare="less_eq"><const>medium</const></test>
    <test target="pattern" name="weight" compare="more"><const>medium</const></test>
    <edit name="embolden" mode="assign"><bool>true</bool></edit>
    <edit name="weight" mode="assign"><const>bold</const></edit>
  </match>
</fontconfig>
