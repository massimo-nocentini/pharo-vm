<!doctype html>
<!-- world.html - the Pharo world page of the Pharo VM for WebAssembly

  The page runs the Pharo VM in a Web Worker (vm-worker.js) on the world
  image, booted with --interactive, and shows its Morphic world in the
  canvas: the worker draws it there (display-worker.js), and world.js
  passes it the pointer, wheel and keyboard (keymap.js), the size of the
  canvas, pastes and focus.  The image is the one the Console page saves
  in this browser, or the build's, or one that Open gives (open-image.js),
  which the worker prepares for the world when it lacks OSWindow-Web.
  The build (stage.mjs) replaces the
  BUILD placeholder, in the pharo-build meta tag and the URLs below, with a
  build id, which the page passes as ?v= on every script, worker and .wasm
  URL.  No external resources: it must be served over plain HTTP (make
  wasm-serve), not from file://. -->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<meta name="description" content="The Pharo world, the Smalltalk environment, running in your browser on WebAssembly.">
<meta name="pharo-build" content="33641eb2b-79a25516be27">
<title>Pharo World</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Cpath d='M10 7l8-4v4z' fill='%23f5a524'/%3E%3Cpath d='M12 30l1.6-17h4.8L20 30z' fill='%231d6fb8'/%3E%3Cpath d='M12.6 9h6.8v4h-6.8z' fill='%23155a96'/%3E%3Cpath d='M13 20h6l.3 3h-6.6z' fill='%23fff'/%3E%3C/svg%3E">
<style>
:root {
  --bg: #f4f6f8;
  --surface: #ffffff;
  --surface-2: #eaeef2;
  --border: #d7dde4;
  --text: #1b1f24;
  --muted: #5b6471;
  --accent: #1d6fb8;
  --accent-strong: #155a96;
  --accent-soft: #e2eefa;
  --on-accent: #ffffff;
  --beacon: #e8930c;
  --focus: #2563eb;
  --stage: #e3e7ec;
  --track: #d3dae2;
  --ok: #15803d;
  --busy: #b45309;
  --wait: #1d6fb8;
  --sleep: #7c3aed;
  --bad: #b42318;
  --shadow: 0 1px 2px rgb(15 30 50 / .06), 0 4px 16px rgb(15 30 50 / .06);
  --float: 0 2px 6px rgb(15 30 50 / .12), 0 8px 28px rgb(15 30 50 / .14);
  --scrim: rgb(15 30 50 / .32);
  --radius: 10px;
  --sans: system-ui, -apple-system, "Segoe UI", Roboto, "Noto Sans", "Helvetica Neue", Arial, sans-serif;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0f1216;
    --surface: #171b21;
    --surface-2: #212730;
    --border: #2f3641;
    --text: #e6eaef;
    --muted: #9aa4b1;
    --accent: #5aa9f0;
    --accent-strong: #80bdf5;
    --accent-soft: #15283b;
    --on-accent: #07111b;
    --beacon: #f5a524;
    --focus: #7aa7ff;
    --stage: #0b0e12;
    --track: #2a313b;
    --ok: #4ade80;
    --busy: #fbbf24;
    --wait: #7aa7ff;
    --sleep: #c4a5ff;
    --bad: #ff8a80;
    --shadow: 0 1px 2px rgb(0 0 0 / .4), 0 6px 20px rgb(0 0 0 / .3);
    --float: 0 2px 6px rgb(0 0 0 / .5), 0 8px 28px rgb(0 0 0 / .45);
    --scrim: rgb(0 0 0 / .55);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0f1216;
  --surface: #171b21;
  --surface-2: #212730;
  --border: #2f3641;
  --text: #e6eaef;
  --muted: #9aa4b1;
  --accent: #5aa9f0;
  --accent-strong: #80bdf5;
  --accent-soft: #15283b;
  --on-accent: #07111b;
  --beacon: #f5a524;
  --focus: #7aa7ff;
  --stage: #0b0e12;
  --track: #2a313b;
  --ok: #4ade80;
  --busy: #fbbf24;
  --wait: #7aa7ff;
  --sleep: #c4a5ff;
  --bad: #ff8a80;
  --shadow: 0 1px 2px rgb(0 0 0 / .4), 0 6px 20px rgb(0 0 0 / .3);
  --float: 0 2px 6px rgb(0 0 0 / .5), 0 8px 28px rgb(0 0 0 / .45);
  --scrim: rgb(0 0 0 / .55);
  color-scheme: dark;
}

*, *::before, *::after { box-sizing: border-box; }
html, body { height: 100%; }
body {
  margin: 0;
  background: var(--bg);
  color: var(--text);
  font: 15px/1.5 var(--sans);
  -webkit-text-size-adjust: 100%;
  overflow: hidden;
}
[hidden] { display: none !important; }
button { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }
.sr-only {
  position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px;
  overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; border: 0;
}

.app {
  height: 100vh;
  height: 100dvh;
  padding: 0 max(16px, env(safe-area-inset-right)) 6px max(16px, env(safe-area-inset-left));
  display: flex;
  flex-direction: column;
}

/* header: brand, toolbar, status */
.top {
  display: flex;
  align-items: center;
  gap: 10px;
  min-width: 0;
  padding: 10px 0 8px;
}
.brand {
  display: flex;
  align-items: center;
  gap: 8px;
  flex: none;
  color: inherit;
  text-decoration: none;
}
/* the logo of pharo.org (pharo-logo.png, 942x312), which says Pharo */
.brand h1 { margin: 0; line-height: 0; }
.brand h1 img { display: block; height: 24px; width: auto; }
.top .grow { flex: 1; min-width: 0; }

.toolbar { display: flex; gap: 4px; min-width: 0; }
.toolbar .sep { width: 1px; margin: 6px 4px; background: var(--border); }
.btn {
  appearance: none;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 6px;
  min-height: 34px;
  padding: 0 11px;
  border: 1px solid var(--border);
  border-radius: 8px;
  background: var(--surface);
  color: var(--text);
  font-size: 13.5px;
  font-weight: 520;
  cursor: pointer;
  white-space: nowrap;
  text-decoration: none;
  transition: background-color .12s, border-color .12s;
}
.btn:hover { background: var(--surface-2); }
.btn:disabled { opacity: .45; cursor: default; }
.btn svg { width: 16px; height: 16px; flex: none; }
.btn.ghost { border-color: transparent; background: none; }
.btn.ghost:hover { background: var(--surface-2); }
.btn.ghost:disabled:hover { background: none; }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--on-accent); font-weight: 600; }
.btn.primary:hover { background: var(--accent-strong); border-color: var(--accent-strong); }
.btn.danger svg { color: var(--bad); }
.btn.console { border-color: var(--accent); color: var(--accent); }

.pill {
  display: inline-flex;
  align-items: center;
  gap: 7px;
  flex: none;
  padding: 4px 11px 4px 9px;
  border: 1px solid var(--border);
  border-radius: 999px;
  background: var(--surface);
  font-size: 12.5px;
  font-weight: 550;
  color: var(--muted);
  white-space: nowrap;
}
.pill .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--muted); }
.pill[data-state="running"] .dot { background: var(--ok); }
.pill[data-state="running"] { color: var(--text); }
.pill[data-state="busy"] .dot { background: var(--busy); animation: pulse 1s ease-in-out infinite; }
.pill[data-state="saving"] .dot { background: var(--sleep); animation: pulse 1s ease-in-out infinite; }
.pill[data-state="loading"] .dot, .pill[data-state="starting"] .dot, .pill[data-state="preparing"] .dot { background: var(--wait); animation: pulse 1s ease-in-out infinite; }
.pill[data-state="exited"] .dot, .pill[data-state="crashed"] .dot, .pill[data-state="error"] .dot { background: var(--bad); }
@keyframes pulse { 50% { opacity: .3; } }
@media (prefers-reduced-motion: reduce) { .pill .dot { animation: none !important; } }

/* the world */
.stage {
  position: relative;
  flex: 1;
  min-height: 0;
  overflow: hidden;
  background: var(--stage);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  box-shadow: var(--shadow);
}
/* The frames are devicePixelRatio (--world-dpr, which world.js sets) times
   the size of the stage, and show one frame pixel per device pixel: the
   canvas is that much larger than the stage, shows the frame one pixel per
   canvas pixel from its top left corner, and is scaled down to the stage.
   Until the image paints a frame of a new size, the old one is neither
   stretched nor moved */
#world {
  position: absolute;
  left: 0;
  top: 0;
  display: block;
  width: calc(100% * var(--world-dpr, 1));
  height: calc(100% * var(--world-dpr, 1));
  transform: scale(calc(1 / var(--world-dpr, 1)));
  transform-origin: 0 0;
  object-fit: none;
  object-position: left top;
  touch-action: none;
  user-select: none;
  -webkit-user-select: none;
  outline: none;
}
/* the keyboard's and the clipboard's target: focusable, invisible */
#sink {
  position: absolute;
  left: 0;
  top: 0;
  width: 1px;
  height: 1px;
  padding: 0;
  border: 0;
  margin: 0;
  opacity: 0;
  resize: none;
  overflow: hidden;
  pointer-events: none;
  font-size: 16px;                      /* no zoom on focus in mobile Safari */
}

.overlay {
  position: absolute;
  inset: 0;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 16px;
  background: var(--stage);
}
.loading {
  width: min(360px, 100%);
  padding: 18px 20px;
  border: 1px solid var(--border);
  border-radius: var(--radius);
  background: var(--surface);
  box-shadow: var(--shadow);
}
.loading p { margin: 0 0 10px; font-size: 14px; color: var(--muted); overflow-wrap: anywhere; }
.loading .track { height: 6px; border-radius: 3px; background: var(--track); overflow: hidden; }
.loading .fill { display: block; width: 0; height: 100%; border-radius: 3px; background: var(--accent); transition: width .15s; }
.loading .track.indefinite .fill { width: 30%; animation: slide 1.2s ease-in-out infinite; }
@keyframes slide { from { transform: translateX(-100%); } to { transform: translateX(340%); } }
@media (prefers-reduced-motion: reduce) { .loading .track.indefinite .fill { animation: none; width: 100%; opacity: .5; } }

.notice {
  position: absolute;
  left: 12px;
  right: 12px;
  bottom: 12px;
  display: flex;
  align-items: center;
  gap: 10px;
  flex-wrap: wrap;
  max-width: 640px;
  margin: 0 auto;
  padding: 8px 10px 8px 12px;
  border: 1px solid var(--border);
  border-radius: 8px;
  background: var(--surface);
  box-shadow: var(--float);
  color: var(--text);
  font-size: 13.5px;
}
.notice span { flex: 1; min-width: 12ch; overflow-wrap: anywhere; }
.notice .close { min-height: 30px; padding: 0 8px; }

/* the footer: a link to the licences of the libraries in the VM */
.foot {
  display: flex;
  flex: none;
  justify-content: flex-end;
  padding: 5px 2px 0;
  font-size: 12px;
  line-height: 16px;
  color: var(--muted);
}
.foot a { color: inherit; text-underline-offset: 2px; }
.foot a:hover { color: var(--accent); }

/* what a drag of files over the page shows: dropping them opens them */
.drop {
  position: fixed;
  inset: 0;
  z-index: 20;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 16px;
  background: var(--scrim);
  pointer-events: none;
}
.drop-card {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 8px;
  width: min(420px, 100%);
  padding: 26px 22px;
  border: 2px dashed var(--accent);
  border-radius: var(--radius);
  background: var(--surface);
  box-shadow: var(--float);
  color: var(--muted);
  font-size: 14px;
  text-align: center;
}
.drop-card svg { width: 30px; height: 30px; color: var(--accent); }
.drop-card p { margin: 0; }
.drop-card strong { display: block; color: var(--text); font-size: 15px; font-weight: 600; }

@media (max-width: 760px) {
  .brand h1 img { height: 20px; }
  .toolbar .label, .top .label { display: none; }
  .toolbar .btn, .top .btn { padding: 0 9px; }
}
@media (max-width: 380px) {
  .top { gap: 6px; }
  .toolbar { gap: 2px; }
  .toolbar .sep { margin: 6px 1px; }
  .toolbar .btn, .top .btn { padding: 0 7px; min-height: 32px; }
  .brand h1 img { height: 16px; }
}
</style>
</head>
<body>
<div class="app">
  <header class="top">
    <a class="brand" href="https://pharo.org/" title="pharo.org">
      <h1><img src="pharo-logo.png?v=33641eb2b-79a25516be27" alt="Pharo" width="72" height="24"></h1>
    </a>
    <div class="toolbar" role="toolbar" aria-label="World controls" title="F6 in the world moves the keyboard here">
      <button class="btn ghost danger" id="stop" type="button" aria-label="Stop" title="Interrupt what Pharo is doing, and open a debugger on it (Alt+.)" disabled>
        <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><rect x="6" y="6" width="12" height="12" rx="2"/></svg><span class="label">Stop</span>
      </button>
      <button class="btn ghost" id="save" type="button" aria-label="Save" title="Save the image, and keep it in this browser" disabled>
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 3h11l3 3v13a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2z"/><path d="M8 3v5h7V3"/><path d="M8 21v-7h8v7"/></svg><span class="label">Save</span>
      </button>
      <button class="btn ghost" id="download" type="button" aria-label="Download" title="Download the image and its .changes, as last saved" disabled>
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3v12"/><path d="M7 10l5 5 5-5"/><path d="M4 15v4a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-4"/></svg><span class="label">Download</span>
      </button>
      <button class="btn ghost" id="open" type="button" aria-label="Open image" title="Start an image of your own: a Pharo .zip (as files.pharo.org has them), or an .image with its .changes and its .sources; one without OSWindow-Web is prepared for the world first. You can also drop them on the page.">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 20V6a2 2 0 0 1 2-2h3.5l2 2H18a2 2 0 0 1 2 2v3"/><path d="M4 20h14.4a1.5 1.5 0 0 0 1.4-1l2.1-6.4a1.2 1.2 0 0 0-1.1-1.6H7.7a1.5 1.5 0 0 0-1.4 1z"/></svg><span class="label">Open</span>
      </button>
      <input type="file" id="open-file" accept=".zip,.image,.changes,.sources" multiple hidden>
    </div>
    <span class="grow"></span>
    <a class="btn console" id="console" href="index.html" title="The Console: a Smalltalk REPL on the image saved in this browser">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M7 9l3 3-3 3M13 15h4"/></svg><span class="label">Console</span>
    </a>
    <span id="status" class="pill" data-state="loading">
      <span class="dot" aria-hidden="true"></span><span id="status-text">Loading</span>
    </span>
    <span id="status-live" class="sr-only" role="status" aria-live="polite"></span>
  </header>

  <main class="stage" id="stage">
    <canvas id="world" aria-label="The Pharo world"></canvas>
    <textarea id="sink" aria-label="Keyboard input of the Pharo world (F6 moves to the toolbar)" autocapitalize="off" autocomplete="off" autocorrect="off" spellcheck="false" tabindex="-1"></textarea>
    <div class="overlay" id="overlay">
      <div class="loading" role="progressbar" aria-label="Loading Pharo" aria-valuemin="0" aria-valuemax="100" id="loading">
        <p id="overlay-text">Loading Pharo…</p>
        <div class="track indefinite" id="track"><span class="fill" id="fill"></span></div>
      </div>
    </div>
    <div class="notice" id="notice" role="status" hidden>
      <span id="notice-text"></span>
      <a class="btn primary" id="notice-link" hidden></a>
      <button class="btn primary" id="notice-action" type="button" hidden></button>
      <a class="btn" id="notice-alt" hidden></a>
      <button class="btn ghost close" id="notice-close" type="button" aria-label="Dismiss">✕</button>
    </div>
  </main>
  <footer class="foot">
    <a href="THIRD-PARTY-NOTICES.txt?v=33641eb2b-79a25516be27" target="_blank" rel="noopener" title="The licences of the libraries in this VM, in a new tab">Third-party notices</a>
  </footer>
</div>

<div class="drop" id="drop" hidden aria-hidden="true">
  <div class="drop-card">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 20V6a2 2 0 0 1 2-2h3.5l2 2H18a2 2 0 0 1 2 2v3"/><path d="M4 20h14.4a1.5 1.5 0 0 0 1.4-1l2.1-6.4a1.2 1.2 0 0 0-1.1-1.6H7.7a1.5 1.5 0 0 0-1.4 1z"/></svg>
    <p><strong>Drop to open</strong>a Pharo .zip, or an .image with its .changes and its .sources</p>
  </div>
</div>

<noscript><p style="padding:16px">This page needs JavaScript and WebAssembly.</p></noscript>
<script src="keymap.js?v=33641eb2b-79a25516be27"></script>
<script src="open-image.js?v=33641eb2b-79a25516be27"></script>
<script src="world.js?v=33641eb2b-79a25516be27"></script>
</body>
