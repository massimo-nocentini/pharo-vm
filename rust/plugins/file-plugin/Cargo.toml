[package]
name = "file-plugin"
description = "FilePlugin in Rust: the VM's core file, directory and stdio primitives over C stdio."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lib]
# Must match the module name the image asks for.
name = "FilePlugin"
crate-type = ["cdylib", "rlib"]

[dependencies]
pharo-vm-plugin = { path = "../../pharo-vm-plugin" }
# The interpreter and other plugins (UnixOSProcessPlugin, FileAttributesPlugin)
# share `FILE *` streams with this plugin through the SQFile record, so all
# file I/O must go through C stdio, not `std::fs` -- the same rationale as
# pharo-platform's cstdio module.
libc = { workspace = true }
