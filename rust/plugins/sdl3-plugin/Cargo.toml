[package]
name = "sdl3-plugin"
description = "SDL3Plugin: SDL3 as Pharo named primitives, bound to the library the VM bundle downloads."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lib]
# Must match the module name the image asks for, and the file name the VM
# looks up: libSDL3Plugin.so / .dylib / SDL3Plugin.dll.
name = "SDL3Plugin"
crate-type = ["cdylib", "rlib"]

[dependencies]
# `dylib` because SDL3 is dlopened, not linked: cmake/importSDL2.cmake
# downloads a ready-made binary, and on Linux does not download SDL3 at all
# yet -- so the plugin has to tolerate its absence at load time.
pharo-vm-plugin = { path = "../../pharo-vm-plugin", features = ["dylib"] }
