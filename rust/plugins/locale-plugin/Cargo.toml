[package]
name = "locale-plugin"
description = "LocalePlugin in Rust: the POSIX locale answers behind the same primitives."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lib]
# Must match the module name the image asks for.
name = "LocalePlugin"
crate-type = ["cdylib", "rlib"]

[dependencies]
pharo-vm-plugin = { path = "../../pharo-vm-plugin" }
# The support layer answers what the platform's C library answers: setlocale,
# localeconv, nl_langinfo, localtime_r. Reimplementing locale data from a
# crate would change the answers per system; going through libc keeps them
# identical to the C plugin's.
libc.workspace = true
