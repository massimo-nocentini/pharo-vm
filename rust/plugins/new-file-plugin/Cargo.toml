[package]
name = "new-file-plugin"
description = "NewFilePlugin in Rust: the fd-based file plugin, Unix implementation."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lib]
# Must match the module name the image asks for.
name = "NewFilePlugin"
crate-type = ["cdylib", "rlib"]

[dependencies]
pharo-vm-plugin = { path = "../../pharo-vm-plugin" }
# Thin syscall access only: the C implementation is open/read/write/lseek/
# mmap and friends, and the port keeps the exact flags, modes and error
# mapping, so it speaks to the same syscalls directly.
libc.workspace = true
