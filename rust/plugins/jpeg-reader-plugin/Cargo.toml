[package]
name = "jpeg-reader-plugin"
description = "JPEGReaderPlugin in Rust: huffman MCU decode, integer IDCT and YCbCr conversion for the image-side JPEG decoder."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lib]
# Must match the module name the image asks for.
name = "JPEGReaderPlugin"
crate-type = ["cdylib", "rlib"]

[dependencies]
pharo-vm-plugin = { path = "../../pharo-vm-plugin" }
