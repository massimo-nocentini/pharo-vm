[package]
name = "large-integers"
description = "LargeIntegers plugin in Rust: the image's arbitrary-precision digit arithmetic."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lib]
# Must match the module name the image asks for.
name = "LargeIntegers"
crate-type = ["cdylib", "rlib"]

[dependencies]
pharo-vm-plugin = { path = "../../pharo-vm-plugin" }
