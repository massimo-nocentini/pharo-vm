[package]
name = "socket-plugin"
description = "SocketPlugin in Rust: BSD sockets, the DNS resolver and the IPv6 address API behind the same 60 primitives."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lib]
# Must match the module name the image asks for.
name = "SocketPlugin"
crate-type = ["cdylib", "rlib"]

[dependencies]
pharo-vm-plugin = { path = "../../pharo-vm-plugin" }
# Typed, fd-safe socket operations. `socket2` is what `std::net` is built on,
# and it exposes the parts std hides but this plugin needs: SOCK_RAW, the
# unconnected UDP calls, per-socket flags, and `SockAddr` for converting
# between `std::net::SocketAddr` and the raw `sockaddr` bytes the image's
# SocketAddress ByteArrays carry.
socket2 = { version = "0.6", features = ["all"] }
# `getaddrinfo`/`getnameinfo` as owned Rust values instead of a libc-owned
# linked list. It also exposes the raw EAI error number, which the image reads
# back through `sqResolverError` -- `std`'s `ToSocketAddrs` discards it.
dns-lookup = "3"
# Still needed for what neither covers: `poll(2)` for the VM's own event loop,
# `getifaddrs`, `getnameinfo` on a raw image-supplied sockaddr, `gethostname`,
# and the setsockopt-by-name table, which needs raw (level, optname) pairs.
libc.workspace = true
