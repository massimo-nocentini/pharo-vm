[package]
name = "unix-os-process-plugin"
description = "UnixOSProcessPlugin in Rust: fork/exec, pipes, signals-to-semaphores, environment and file-descriptor plumbing."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lib]
# Must match the module name the image asks for.
name = "UnixOSProcessPlugin"
crate-type = ["cdylib", "rlib"]

[dependencies]
pharo-vm-plugin = { path = "../../pharo-vm-plugin" }
# Thin syscall access: fork/exec, signals, fcntl, stdio-stream calls. The
# whole plugin is a wrapper over these, so the dependency is the point.
libc = "0.2"
