[package]
name = "bit-blt-plugin"
description = "BitBltPlugin in Rust: the VM's 2D blitter, ported function-for-function from the Slang-generated C."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lib]
# Must match the module name the image asks for.
name = "BitBltPlugin"
crate-type = ["cdylib", "rlib"]

[dependencies]
pharo-vm-plugin = { path = "../../pharo-vm-plugin" }
