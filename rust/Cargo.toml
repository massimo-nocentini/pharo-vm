# Rust components of the Pharo VM: the platform layer and the plugin SDK.
#
# The plugin *cdylibs* are not here. They live in their own workspace,
# rust/plugins/Cargo.toml, for one reason: cargo reads profiles only from a
# workspace root, and the two halves need opposite panic strategies. See the
# [profile] comment at the bottom of this file.
#
# See rust/README.md for how this fits into the CMake build, and
# docs/rust-port.md for the migration plan this workspace implements.

[workspace]
resolver = "2"
members = [
    "pharo-vm-sys",
    "pharo-platform",
    "pharo-vm-plugin",
    "pharo-vm-plugin-macros",
]
# Belt and braces: the plugin crates and the examples name rust/plugins as
# their workspace, but a future glob member here would silently claim them
# back and put them on the wrong panic strategy.
exclude = [
    "plugins",
    "examples",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
# Kept in step with the oldest toolchain we are willing to require of packagers.
rust-version = "1.77"  # core::mem::offset_of!, used by the ABI layout test
license = "MIT"
publish = false

[workspace.dependencies]
pharo-vm-sys = { path = "pharo-vm-sys" }
# Only for the C library entry points a port has to keep calling: `pharo-platform`
# uses std where it can, but a file whose handle is a `FILE *` shared with the
# generated interpreter has to speak C stdio, not `std::fs`.
libc = "0.2"
# For plugins that bind a third-party library the VM bundle downloads rather
# than links: those arrive as runtime objects, so the binding is a dlopen.
libloading = "0.8"

# The platform layer aborts, and must.
#
# `pharo-platform` is linked *into* libPharoVMCore: its `extern "C"` functions
# are called straight from the generated interpreter, from the heartbeat
# thread and from signal handlers, with no `catch_unwind` anywhere above them.
# A panic unwinding out of one of those into C is undefined behaviour, so
# aborting is the only sound answer, and entry points that can fail gracefully
# catch the failure themselves rather than relying on unwinding.
#
# This governs only the four members above. The plugin cdylibs are built from
# rust/plugins/Cargo.toml, which sets `panic = "unwind"` because a plugin is
# dlopened rather than linked and every primitive body is fenced by
# `catch_unwind`. `pharo-vm-plugin` itself is a member here *and* a path
# dependency of every plugin, so it is compiled under whichever profile belongs
# to the workspace being built -- abort here, unwind there. That is intended:
# the SDK's catches are only load-bearing in the cdylib.
[profile.release]
panic = "abort"

[profile.dev]
panic = "abort"
