# Rust components of the Pharo VM.
#
# See rust/README.md for how this fits into the CMake build, and
# docs/rust-port.md for the migration plan this workspace implements.

[workspace]
resolver = "2"
members = [
    "pharo-vm-sys",
    "pharo-platform",
    "pharo-vm-plugin",
    "pharo-vm-plugin-macros",
    "examples/hello-plugin",
    "examples/uuid-plugin",
    "plugins/jpeg-plugin",
    "plugins/b2d-plugin",
    "plugins/bit-blt-plugin",
    "plugins/cairo-plugin",
    "plugins/dsa-prims",
    "plugins/file-attributes-plugin",
    "plugins/file-plugin",
    "plugins/jpeg-reader-plugin",
    "plugins/large-integers",
    "plugins/locale-plugin",
    "plugins/misc-primitive-plugin",
    "plugins/new-file-plugin",
    "plugins/pango-plugin",
    "plugins/sdl3-plugin",
    "plugins/socket-plugin",
    "plugins/squeak-ssl",
    "plugins/surface-plugin",
    "plugins/unix-os-process-plugin",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
# Kept in step with the oldest toolchain we are willing to require of packagers.
rust-version = "1.77"  # core::mem::offset_of!, used by the ABI layout test
license = "MIT"
publish = false

[workspace.dependencies]
pharo-vm-sys = { path = "pharo-vm-sys" }
# Only for the C library entry points a port has to keep calling: `pharo-platform`
# uses std where it can, but a file whose handle is a `FILE *` shared with the
# generated interpreter has to speak C stdio, not `std::fs`.
libc = "0.2"
# For plugins that bind a third-party library the VM bundle downloads rather
# than links: those arrive as runtime objects, so the binding is a dlopen.
libloading = "0.8"

# A panic must never unwind across the `extern "C"` boundary into the generated
# interpreter: that is undefined behaviour. Aborting is the only sound default.
# Entry points that can fail gracefully catch the failure themselves instead of
# relying on unwinding.
[profile.release]
panic = "abort"

[profile.dev]
panic = "abort"
